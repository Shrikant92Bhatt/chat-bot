steps:
  # 1. Build Docker image for chat-api
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/chat-api:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/chat-api:latest'
      - '-f'
      - 'Dockerfile.api'
      - '.'

  # 2. Push image to GCP Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/chat-api:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/chat-api:latest'

  # 3. Deploy to GCP Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'chat-api-service'
      - '--image=gcr.io/$PROJECT_ID/chat-api:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/chat-api:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/chat-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
