name: Delete Merged Branch

# Deletes a pull request's source branch once it is merged, so merged work
# doesn't pile up as stale branches. Equivalent to the repository setting
# "Automatically delete head branches" (Settings -> General), which can be
# turned on as well; whichever runs second finds the branch already gone.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    name: Delete source branch
    runs-on: ubuntu-latest
    # Merged only (not merely closed), same-repo branches only (a fork's
    # branch isn't ours to delete), and never the default branch.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env, never interpolated into the script: branch names
          # are user-controlled and could otherwise inject shell.
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          if gh api -X DELETE "repos/${REPO}/git/refs/heads/${BRANCH}" 2>err.txt; then
            echo "Deleted branch ${BRANCH}"
          elif grep -q "Reference does not exist" err.txt; then
            echo "Branch ${BRANCH} was already deleted."
          else
            cat err.txt
            exit 1
          fi
