name: Enterprise CI/CD Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
    types: [opened, synchronize, reopened]

# Security Permissions Standard
permissions:
  contents: read
  id-token: write

# Prevent wasteful concurrent pipeline runs on duplicate branch pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 0: On PRs only - keeps package.json's minor version ahead of main,
  # so the bump lands as part of the PR's own merge commit instead of a
  # separate push to the protected main branch after the fact (main requires
  # the two status checks below to pass on a commit before it can land there,
  # which a bot pushing directly post-merge would not satisfy).
  version-bump:
    name: Version Bump Check
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Bump minor version if not already ahead of main
        run: |
          git fetch origin main --quiet
          node <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const mainPkg = JSON.parse(execSync('git show origin/main:package.json').toString());
          const prPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          const parse = (v) => {
            const [maj, min] = v.split('.').map(Number);
            return { maj, min };
          };
          const m = parse(mainPkg.version);
          const p = parse(prPkg.version);

          const alreadyBumped = p.maj > m.maj || (p.maj === m.maj && p.min > m.min);
          if (alreadyBumped) {
            console.log(`package.json version (${prPkg.version}) is already ahead of main (${mainPkg.version}) - nothing to do.`);
            process.exit(0);
          }

          const newVersion = `${m.maj}.${m.min + 1}.0`;
          console.log(`Bumping version: ${mainPkg.version} -> ${newVersion}`);
          fs.writeFileSync('.new-version', newVersion);
          EOF

          if [ -f .new-version ]; then
            NEW_VERSION=$(cat .new-version)
            rm .new-version
            npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to $NEW_VERSION"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

  # Job 1: Nx Monorepo Compilation & Quality Check. chat-client and chat-api
  # deploys themselves are handled by Vercel's own GitHub integration (see
  # vercel.json at the repo root) once the Vercel project is connected to
  # this repo in the Vercel dashboard - no build/deploy steps needed here
  # for either app.
  build-and-lint:
    name: Monorepo Build Check
    runs-on: ubuntu-latest
    outputs:
      sandbox_affected: ${{ steps.affected.outputs.sandbox }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Derive Nx base/head SHAs for affected detection
        uses: nrwl/nx-set-shas@v4

      - name: Determine if the sandbox microservice changed
        id: affected
        run: |
          # infra/sandbox-service is a standalone Node service (not an Nx
          # project), deployed separately to a small always-on-but-cheap
          # container host because it depends on isolated-vm, a native addon
          # that can't run inside a Vercel serverless function.
          CHANGED=$(git diff --name-only "$NX_BASE" "$NX_HEAD" -- infra/sandbox-service cloudbuild-sandbox.yaml .github/workflows/ci-cd.yml)
          echo "Changed sandbox-service files: $CHANGED"
          if [ -n "$CHANGED" ]; then
            echo "sandbox=true" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Affected Projects
        run: npx nx affected -t build

  # Job 2: Build & deploy the sandbox microservice only (the one piece that
  # stays on a container host post-migration). Gated on push to main and on
  # infra/sandbox-service actually having changed, so most pushes (which
  # only touch chat-client/chat-api, now deployed via Vercel) skip this
  # entirely.
  deploy-sandbox-service:
    name: Deploy Sandbox Service
    runs-on: ubuntu-latest
    needs: build-and-lint
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-lint.outputs.sandbox_affected == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GCP Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit sandbox-service to GCP Cloud Build
        run: |
          gcloud builds submit --config=cloudbuild-sandbox.yaml

      - name: Deploy sandbox-service to Cloud Run
        run: |
          # --allow-unauthenticated: chat-api runs on Vercel, which has no
          # GCP identity to mint an IAM auth token, so this endpoint is
          # protected instead by the shared CODE_SANDBOX_SERVICE_SECRET
          # header (see infra/sandbox-service/src/server.ts) - set the same
          # value here and as CODE_SANDBOX_SERVICE_SECRET on the Vercel
          # project.
          gcloud run deploy sandbox-service \
            --image=asia-south1-docker.pkg.dev/$(gcloud config get-value project)/chat-repo/sandbox-service:latest \
            --region=asia-south1 \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=10 \
            --min-instances=0 \
            --max-instances=5 \
            --timeout=30 \
            --set-secrets="CODE_SANDBOX_SERVICE_SECRET=CODE_SANDBOX_SERVICE_SECRET:latest"
