name: Enterprise CI/CD Pipeline

# Feature branches are covered by their pull_request run; push runs only on
# main, so main itself is still built and tested after every merge. The old `push: ["*"]` filter also
# never matched branch names containing "/" (e.g. feat/x), and on branches it
# did match it duplicated every PR run.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Least privilege. Nothing here deploys - Vercel's GitHub integration builds
# and deploys chat-client, chat-api and sandbox-service (see vercel.json) -
# so no cloud credentials are needed. Jobs that push widen this themselves.
permissions:
  contents: read

# Prevent wasteful concurrent pipeline runs on duplicate branch pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 0: On PRs only - keeps package.json's minor version ahead of main,
  # so the bump lands as part of the PR's own merge commit instead of a
  # separate push to the protected main branch after the fact (main requires
  # the two status checks below to pass on a commit before it can land there,
  # which a bot pushing directly post-merge would not satisfy).
  version-bump:
    name: Version Bump Check
    runs-on: ubuntu-latest
    # Fork PRs can't be pushed to with this repo's token - skip rather than fail.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # A commit pushed with the default GITHUB_TOKEN is authored by
          # github-actions[bot], and GitHub holds the CI run it triggers until
          # someone clicks "Approve and run" - which is why PRs sat waiting
          # after every version bump. Pushing with VERSION_BUMP_TOKEN (a
          # fine-grained PAT or GitHub App token with Contents: read & write
          # on this repo) makes the follow-up run start on its own. Falls back
          # to GITHUB_TOKEN when the secret isn't set.
          token: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}

      - name: Bump minor version if not already ahead of main
        run: |
          git fetch origin main --quiet
          node <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const mainPkg = JSON.parse(execSync('git show origin/main:package.json').toString());
          const prPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          const parse = (v) => {
            const [maj, min] = v.split('.').map(Number);
            return { maj, min };
          };
          const m = parse(mainPkg.version);
          const p = parse(prPkg.version);

          const alreadyBumped = p.maj > m.maj || (p.maj === m.maj && p.min > m.min);
          if (alreadyBumped) {
            console.log(`package.json version (${prPkg.version}) is already ahead of main (${mainPkg.version}) - nothing to do.`);
            process.exit(0);
          }

          const newVersion = `${m.maj}.${m.min + 1}.0`;
          console.log(`Bumping version: ${mainPkg.version} -> ${newVersion}`);
          fs.writeFileSync('.new-version', newVersion);
          EOF

          if [ -f .new-version ]; then
            NEW_VERSION=$(cat .new-version)
            rm .new-version
            npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to $NEW_VERSION"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

  # Job 1: Nx Monorepo Compilation & Quality Check. Deploys are handled by
  # Vercel's own GitHub integration (see vercel.json at the repo root),
  # including the sandbox-service container - no deploy steps here.
  build-and-lint:
    name: Monorepo Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Derive Nx base/head SHAs for affected detection
        uses: nrwl/nx-set-shas@v4

      - name: Build Affected Projects
        run: npx nx affected -t build

      # chat-api, chat-client and admin-analytics unit tests (vitest). Lint is
      # not run yet: admin-analytics and admin-emulator import each other,
      # which @nx/enforce-module-boundaries rejects on main as well.
      - name: Test Affected Projects
        run: npx nx affected -t test
