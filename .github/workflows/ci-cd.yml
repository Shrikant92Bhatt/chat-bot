name: Enterprise CI/CD Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
    types: [opened, synchronize, reopened]

# Security Permissions Standard
permissions:
  contents: read
  id-token: write

# Prevent wasteful concurrent pipeline runs on duplicate branch pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Nx Monorepo Compilation & Quality Check
  build-and-lint:
    name: Monorepo Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build All Monorepo Projects
        run: npm run build:all

  # Job 2: Production Container Build & GCP Integration Check
  gcp-build-check:
    name: GCP Docker Build Verification
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Express API Container
        run: |
          docker build -t chat-api:test -f Dockerfile.api .

      - name: Build Frontend Angular NGINX Container
        run: |
          docker build -t chat-client:test -f Dockerfile.client .

      # GCP steps only run on pushes to main (not on PRs, which have no GCP creds needed).
      # Note: the "secrets" context is not available in step-level `if:` conditions,
      # so gating is done on github.ref/event_name here instead.
      - name: Authenticate to GCP
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GCP Cloud SDK
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit to GCP Cloud Build
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          gcloud builds submit --config=cloudbuild.yaml

  # Job 3: Deploy to Cloud Run (main branch only, after images are built above)
  deploy-to-cloud-run:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: gcp-build-check
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GCP Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy chat-api
        run: |
          gcloud run deploy chat-api \
            --image=asia-south1-docker.pkg.dev/chat-bot-505613/chat-repo/chat-api:latest \
            --region=asia-south1 \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLIENT_ID=953232172604-iukeghd5021k56htjq7ep332bvtvppot.apps.googleusercontent.com,ALLOWED_ORIGIN=https://nexusai-gcp.duckdns.org" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,APP_SESSION_SECRET=APP_SESSION_SECRET:latest"

      - name: Deploy chat-client
        run: |
          gcloud run deploy chat-client \
            --image=asia-south1-docker.pkg.dev/chat-bot-505613/chat-repo/chat-client:latest \
            --region=asia-south1 \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="API_URL=https://nexusai-gcp.duckdns.org"
