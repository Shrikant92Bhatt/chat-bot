name: Enterprise CI/CD Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
    types: [opened, synchronize, reopened]

# Security Permissions Standard
permissions:
  contents: read
  id-token: write

# Prevent wasteful concurrent pipeline runs on duplicate branch pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Nx Monorepo Compilation & Quality Check
  build-and-lint:
    name: Monorepo Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build All Monorepo Projects
        run: npm run build:all

  # Job 2: Production Container Build & GCP Integration Check
  gcp-build-check:
    name: GCP Docker Build Verification
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Express API Container
        run: |
          docker build -t chat-api:test -f Dockerfile.api .

      - name: Build Frontend Angular NGINX Container
        run: |
          docker build -t chat-client:test -f Dockerfile.client .

      - name: Build Admin Analytics NGINX Container
        run: |
          docker build -t admin-analytics:test -f Dockerfile.admin .

      # GCP steps only run on pushes to main (not on PRs, which have no GCP creds needed).
      # Note: the "secrets" context is not available in step-level `if:` conditions,
      # so gating is done on github.ref/event_name here instead.
      - name: Authenticate to GCP
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GCP Cloud SDK
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit to GCP Cloud Build
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          gcloud builds submit --config=cloudbuild.yaml

  # Job 3: Deploy to Cloud Run (main branch only, after images are built above)
  deploy-to-cloud-run:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: gcp-build-check
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GCP Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy chat-api
        run: |
          gcloud run deploy chat-api \
            --image=asia-south1-docker.pkg.dev/chat-bot-505613/chat-repo/chat-api:latest \
            --region=asia-south1 \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLIENT_ID=953232172604-iukeghd5021k56htjq7ep332bvtvppot.apps.googleusercontent.com,ALLOWED_ORIGIN=https://nexusai-gcp.duckdns.org,FIRESTORE_DATABASE_ID=nexus-ai,GCS_BUCKET_NAME=nexusai-generated-images,OPENROUTER_BASE_URL=https://openrouter.ai/api/v1" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,APP_SESSION_SECRET=APP_SESSION_SECRET:latest,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest"

      - name: Deploy chat-client
        run: |
          gcloud run deploy chat-client \
            --image=asia-south1-docker.pkg.dev/chat-bot-505613/chat-repo/chat-client:latest \
            --region=asia-south1 \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="API_URL=https://nexusai-gcp.duckdns.org"

      # --allow-unauthenticated is correct here even though this is the ADMIN
      # console: authorization is enforced in-app (Google Sign-In -> app session
      # JWT -> the API's requireAdmin, which re-reads the role from Firestore on
      # every request), exactly like chat-client. Putting Cloud Run IAM in front
      # of it instead would block the anonymous GET /api/chat/config and the
      # sign-in flow itself. The served bundle contains no secrets - every
      # number on the dashboard comes from an admin-gated API call.
      #
      # MANUAL FOLLOW-UP once this service has a URL (it cannot be done before
      # the first deploy, and neither step is automatable from here):
      #   1. Append the admin-analytics URL to ALLOWED_ORIGIN on the chat-api
      #      service (it already accepts a comma-separated list - see the CORS
      #      setup in apps/chat-api/src/main.ts). Until then every admin API
      #      call fails CORS preflight in the browser.
      #   2. Add the same URL to the Google Cloud Console OAuth client's
      #      "Authorized JavaScript origins". Until then Google Sign-In refuses
      #      to initialise on this origin.
      - name: Deploy admin-analytics
        run: |
          gcloud run deploy admin-analytics \
            --image=asia-south1-docker.pkg.dev/chat-bot-505613/chat-repo/admin-analytics:latest \
            --region=asia-south1 \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="API_URL=https://nexusai-gcp.duckdns.org"
