name: Enterprise CI/CD Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
    types: [opened, synchronize, reopened]

# Security Permissions Standard
permissions:
  contents: read
  id-token: write

# Prevent wasteful concurrent pipeline runs on duplicate branch pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Nx Monorepo Compilation & Quality Check
  build-and-lint:
    name: Monorepo Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build All Monorepo Projects
        run: npm run build:all

  # Job 2: Production Container Build & GCP Integration Check
  gcp-build-check:
    name: GCP Docker Build Verification
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Express API Container
        run: |
          docker build -t chat-api:test -f Dockerfile.api .

      - name: Build Frontend Angular NGINX Container
        run: |
          docker build -t chat-client:test -f Dockerfile.client .

      # GCP Authentication (Activated when GCP_SA_KEY secret is configured)
      - name: Authenticate to GCP
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GCP Cloud SDK
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit to GCP Cloud Build
        if: ${{ secrets.GCP_SA_KEY != '' && github.ref == 'refs/heads/main' }}
        run: |
          gcloud builds submit --config=cloudbuild.yaml
