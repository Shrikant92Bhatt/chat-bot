<div class="relative min-h-screen flex items-center justify-center p-6 overflow-hidden">
  <div class="ambient-glow-1" aria-hidden="true"></div>
  <div class="ambient-glow-2" aria-hidden="true"></div>

  <div class="relative z-10 w-full max-w-sm glass-card rounded-2xl p-8">
    <div class="flex items-center gap-3 mb-6">
      <div
        class="w-10 h-10 rounded-xl bg-gradient-to-br from-accentCyan to-accentViolet flex items-center justify-center shadow-cyanGlow"
        aria-hidden="true"
      >
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-semibold text-slate-100">NexusAI Admin</h1>
        <p class="text-xs text-slate-400">Usage &amp; cost analytics</p>
      </div>
    </div>

    <p class="text-sm text-slate-300 mb-1">Sign in to continue</p>
    <p class="text-xs text-slate-500 mb-6">
      This console is restricted to accounts with the admin role. Signing in with any other Google
      account will show an access-denied notice.
    </p>

    <button
      type="button"
      (click)="auth.signInWithGoogle()"
      [disabled]="auth.isSigningIn()"
      class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-xl bg-white text-slate-800 font-medium text-sm hover:bg-slate-100 disabled:opacity-60 disabled:cursor-not-allowed transition-colors"
    >
      @if (auth.isSigningIn()) {
        <span
          class="w-4 h-4 rounded-full border-2 border-slate-300 border-t-slate-700 animate-spin"
          aria-hidden="true"
        ></span>
        Signing in…
      } @else {
        <svg class="w-5 h-5" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.7-.2-2.5H12v4.8h6.4a5.5 5.5 0 01-2.4 3.6v3h3.9c2.3-2.1 3.6-5.2 3.6-8.9z" />
          <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3a7.2 7.2 0 01-10.7-3.8H1.4v3.1A12 12 0 0012 24z" />
          <path fill="#FBBC05" d="M5.4 14.3a7.2 7.2 0 010-4.6V6.6H1.4a12 12 0 000 10.8l4-3.1z" />
          <path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.5-3.5A12 12 0 001.4 6.6l4 3.1A7.2 7.2 0 0112 4.8z" />
        </svg>
        Continue with Google
      }
    </button>

    @if (auth.loginError(); as error) {
      <div
        class="mt-4 flex items-start gap-2 px-3 py-2.5 rounded-lg bg-rose-500/10 border border-rose-400/30"
        role="alert"
      >
        <svg class="w-4 h-4 text-rose-300 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
        </svg>
        <p class="text-xs text-rose-100">{{ error }}</p>
      </div>
    }
  </div>
</div>
