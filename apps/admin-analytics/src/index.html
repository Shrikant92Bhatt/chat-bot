<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>NexusAI Admin Analytics</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Admin-only usage, cost and user analytics for the NexusAI enterprise chat platform." />
    <!-- Admin console is never something to surface in search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <!-- Runtime config (chat-api base URL), regenerated at container startup
         from the API_URL env var - see docker-entrypoint.sh, shared with
         chat-client's image. -->
    <script src="assets/env.js"></script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-obsidian text-slate-100 font-sans antialiased min-h-screen">
    <app-root></app-root>
  </body>
</html>
