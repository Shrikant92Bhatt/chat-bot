<div class="rounded-2xl border border-white/10 bg-white/[0.03] overflow-hidden max-w-xs">
  <img *ngIf="data.imageUrl" [src]="data.imageUrl" alt="" class="w-full h-32 object-cover" />
  <div class="p-3">
    <div class="text-sm text-slate-100 font-medium line-clamp-2">{{ data.name }}</div>
    <div *ngIf="data.description" class="text-xs text-slate-400 line-clamp-2 mt-1">{{ data.description }}</div>
    <div class="flex items-center justify-between mt-2">
      <span *ngIf="data.price != null" class="text-sm font-semibold text-white">{{ data.price | number: '1.2-2' }} {{ data.currency }}</span>
      <span *ngIf="data.rating != null" class="text-xs text-accentAmber">★ {{ data.rating }}</span>
    </div>
    <a *ngIf="data.url" [href]="data.url" target="_blank" rel="noopener" class="inline-block text-[11px] text-accentCyan hover:underline mt-2">
      View product ↗
    </a>
  </div>
</div>
