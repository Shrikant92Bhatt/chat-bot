<div class="rounded-2xl border border-white/10 bg-white/[0.03] overflow-hidden max-w-sm hover:border-white/20 transition-colors duration-200">
  <!-- Product image -->
  <div *ngIf="data.imageUrl" class="w-full h-40 overflow-hidden bg-white/5">
    <img [src]="data.imageUrl" alt="" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" loading="lazy" />
  </div>
  <div *ngIf="!data.imageUrl" class="w-full h-40 bg-gradient-to-br from-white/10 to-white/5 flex items-center justify-center">
    <svg viewBox="0 0 24 24" class="w-12 h-12 text-slate-600" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2" />
      <circle cx="8.5" cy="8.5" r="1.5" />
      <path d="M21 15l-5-5L5 21" />
    </svg>
  </div>

  <!-- Product info -->
  <div class="p-4 flex flex-col gap-3">
    <!-- Name -->
    <div>
      <h3 class="text-sm font-semibold text-white line-clamp-2 leading-snug">{{ data.name }}</h3>
    </div>

    <!-- Description -->
    <div *ngIf="data.description" class="text-xs text-slate-400 line-clamp-2">{{ data.description }}</div>

    <!-- Price and rating -->
    <div class="flex items-center justify-between gap-2 py-2 border-t border-white/5">
      <div *ngIf="data.price != null" class="flex flex-col">
        <span class="text-xs text-slate-400">Price</span>
        <span class="text-base font-bold text-white">{{ data.price | number: '1.2-2' }}</span>
        <span class="text-xs text-slate-500">{{ data.currency }}</span>
      </div>
      <div *ngIf="data.rating != null" class="flex flex-col items-end">
        <span class="text-xs text-slate-400">Rating</span>
        <span class="text-lg font-bold text-accentAmber">★ {{ data.rating }}</span>
      </div>
    </div>

    <!-- CTA -->
    <a
      *ngIf="data.url"
      [href]="data.url"
      target="_blank"
      rel="noopener"
      class="block text-center text-xs font-semibold text-accentCyan hover:text-cyan-300 hover:bg-white/5 px-3 py-2 rounded-lg transition-colors duration-200"
    >
      View Product ↗
    </a>
  </div>
</div>
