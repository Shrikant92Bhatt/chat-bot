<div class="rounded-2xl border border-white/10 bg-white/[0.03] p-4">
  <div class="text-sm text-slate-100 font-medium">{{ data.title }}</div>
  <div *ngIf="data.description" class="text-xs text-slate-400 mt-1">{{ data.description }}</div>

  <!-- Unanswered: Confirm/Cancel buttons -->
  <div *ngIf="!resolved()" class="flex gap-2 mt-3">
    <button
      (click)="onConfirm()"
      class="px-3 py-1.5 rounded-full text-xs font-medium bg-accentCyan/20 text-accentCyan hover:bg-accentCyan/30 transition-colors"
    >
      {{ data.confirmLabel || 'Confirm' }}
    </button>
    <button
      (click)="onCancel()"
      class="px-3 py-1.5 rounded-full text-xs font-medium bg-white/5 text-slate-300 hover:bg-white/10 transition-colors"
    >
      {{ data.cancelLabel || 'Cancel' }}
    </button>
  </div>

  <!-- Answered: locked-in resolution, buttons replaced so a second click can't re-fire the action -->
  <div *ngIf="resolved()" class="flex items-center gap-1.5 mt-3 text-xs font-medium" role="status">
    <ng-container *ngIf="resolved() === 'confirmed'; else cancelledState">
      <span class="text-accentCyan">✓</span>
      <span class="text-accentCyan">{{ data.confirmLabel || 'Confirm' }} — confirmed</span>
    </ng-container>
    <ng-template #cancelledState>
      <span class="text-slate-400">✕</span>
      <span class="text-slate-400">{{ data.cancelLabel || 'Cancel' }} — cancelled</span>
    </ng-template>
  </div>
</div>
