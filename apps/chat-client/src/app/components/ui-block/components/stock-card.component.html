<div class="space-y-3">
  <!-- Price card -->
  <div
    class="rounded-2xl border p-4 backdrop-blur-sm"
    [ngClass]="[stockTrend(data.change).bg, stockTrend(data.change).border]"
  >
    <!-- Header with symbol and company name -->
    <div class="flex items-start justify-between mb-3">
      <div class="min-w-0">
        <div class="flex items-baseline gap-2">
          <div class="text-lg font-bold text-white">{{ data.symbol }}</div>
          <div class="text-xs text-slate-400">{{ data.currency }}</div>
        </div>
        <div class="text-sm text-slate-400 mt-1 truncate">{{ data.name }}</div>
      </div>
    </div>

    <!-- Price and change display -->
    <div class="flex items-end gap-3">
      <div>
        <div class="text-4xl font-bold text-white leading-none">{{ data.price | number: '1.2-2' }}</div>
      </div>
      <div
        class="px-3 py-1.5 rounded-lg font-semibold text-sm flex items-center gap-1.5 shrink-0"
        [ngClass]="data.change > 0 ? 'bg-accentEmerald/20 text-accentEmerald' : data.change < 0 ? 'bg-accentRose/20 text-accentRose' : 'bg-slate-500/20 text-slate-400'"
      >
        <span class="text-lg">{{ stockTrend(data.change).arrow }}</span>
        <span>{{ data.change >= 0 ? '+' : '' }}{{ data.change | number: '1.2-2' }}</span>
        <span class="text-xs font-medium">({{ data.changePercent >= 0 ? '+' : '' }}{{ data.changePercent | number: '1.2-2' }}%)</span>
      </div>
    </div>
  </div>

  <!-- Stock chart -->
  <app-ui-stock-chart *ngIf="getChartData()" [data]="getChartData()!"></app-ui-stock-chart>
</div>
