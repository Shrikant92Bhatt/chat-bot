<div class="rounded-2xl border border-white/10 bg-white/[0.03] p-4">
  <div *ngIf="data.title" class="text-[11px] font-medium text-slate-400 mb-2">{{ data.title }}</div>

  <svg *ngIf="data.chartType === 'line'" viewBox="0 0 300 120" class="w-full h-32">
    <polyline
      *ngFor="let series of data.series; let i = index"
      [attr.points]="linePoints(data, i)"
      fill="none"
      [attr.stroke]="seriesColor(i)"
      stroke-width="2"
    />
  </svg>

  <svg *ngIf="data.chartType === 'area'" viewBox="0 0 300 120" class="w-full h-32">
    <polygon
      *ngFor="let series of data.series; let i = index"
      [attr.points]="areaPoints(data, i)"
      [attr.fill]="seriesColor(i)"
      fill-opacity="0.18"
      [attr.stroke]="seriesColor(i)"
      stroke-width="2"
    />
  </svg>

  <svg *ngIf="data.chartType === 'bar'" viewBox="0 0 300 120" class="w-full h-32">
    <rect
      *ngFor="let bar of barRects(data)"
      [attr.x]="bar.x"
      [attr.y]="bar.y"
      [attr.width]="bar.width"
      [attr.height]="bar.height"
      [attr.fill]="bar.color"
      rx="1"
    >
      <title>{{ bar.label }}: {{ bar.value }}</title>
    </rect>
  </svg>

  <svg *ngIf="data.chartType === 'scatter'" viewBox="0 0 300 120" class="w-full h-32">
    <circle
      *ngFor="let point of scatterPoints(data)"
      [attr.cx]="point.cx"
      [attr.cy]="point.cy"
      r="3"
      [attr.fill]="point.color"
    >
      <title>{{ point.label }}: {{ point.value }}</title>
    </circle>
  </svg>

  <div *ngIf="data.chartType === 'pie'" class="flex items-center gap-4">
    <svg viewBox="0 0 100 100" class="w-28 h-28 shrink-0 -rotate-90">
      <circle
        *ngFor="let slice of pieSlices(data)"
        cx="50"
        cy="50"
        r="40"
        fill="none"
        [attr.stroke]="slice.color"
        stroke-width="20"
        [attr.stroke-dasharray]="slice.dasharray"
        [attr.stroke-dashoffset]="slice.dashoffset"
      >
        <title>{{ slice.label }}: {{ slice.percent }}%</title>
      </circle>
    </svg>
    <ul class="text-xs text-slate-300 space-y-1">
      <li *ngFor="let slice of pieSlices(data)" class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full shrink-0" [style.background]="slice.color"></span>
        <span>{{ slice.label }} — {{ slice.percent }}%</span>
      </li>
    </ul>
  </div>

  <div class="flex flex-wrap gap-3 mt-3">
    <div *ngFor="let series of data.series; let i = index" class="flex items-center gap-1.5 text-[11px] text-slate-400">
      <span class="w-2 h-2 rounded-full shrink-0" [style.background]="seriesColor(i)"></span>
      {{ series.name }}
    </div>
  </div>
</div>
