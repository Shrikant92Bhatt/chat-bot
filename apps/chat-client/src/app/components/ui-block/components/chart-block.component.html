<div class="rounded-2xl border border-white/10 bg-white/[0.03] p-4">
  <div *ngIf="data.title" class="text-sm font-semibold text-slate-300 mb-4">{{ data.title }}</div>

  <!-- Reusable axis fragment: gridlines + y ticks + x category labels. -->
  <ng-template #axes let-data="data">
    <g aria-hidden="true">
      <line
        *ngFor="let tick of yAxisTicks(data)"
        [attr.x1]="padLeft"
        [attr.x2]="chartW - padRight"
        [attr.y1]="tick.y"
        [attr.y2]="tick.y"
        stroke="#ffffff"
        stroke-opacity="0.08"
        stroke-width="1"
      />
      <text
        *ngFor="let tick of yAxisTicks(data)"
        [attr.x]="padLeft - 4"
        [attr.y]="tick.y + 3"
        text-anchor="end"
        font-size="7.5"
        fill="#64748b"
      >
        {{ tick.label }}
      </text>
      <text
        *ngFor="let tick of xAxisTicks(data)"
        [attr.x]="tick.x"
        [attr.y]="chartH - 5"
        text-anchor="middle"
        font-size="7.5"
        fill="#64748b"
      >
        {{ tick.label }}
      </text>
    </g>
  </ng-template>

  <ng-container *ngIf="hasData(data); else emptyState">
    <div class="relative">
      <svg
        *ngIf="data.chartType === 'line'"
        [attr.viewBox]="viewBox"
        class="w-full h-32"
        role="img"
        [attr.aria-label]="chartSummary(data)"
      >
        <ng-container *ngTemplateOutlet="axes; context: { data: data }"></ng-container>
        <polyline
          *ngFor="let series of data.series; let i = index"
          [attr.points]="linePoints(data, i)"
          fill="none"
          [attr.stroke]="seriesColor(i)"
          stroke-width="2"
          stroke-linejoin="round"
          stroke-linecap="round"
        />
        <rect
          *ngFor="let band of hoverBands(data)"
          [attr.x]="band.x"
          [attr.y]="padTop"
          [attr.width]="band.width"
          [attr.height]="plotH"
          fill="transparent"
          tabindex="0"
          [attr.aria-label]="band.heading"
          (mouseenter)="showTooltip(band.key, band.x + band.width / 2, band.heading, band.lines)"
          (mouseleave)="hideTooltip()"
          (click)="toggleTooltip(band.key, band.x + band.width / 2, band.heading, band.lines)"
          (focus)="showTooltip(band.key, band.x + band.width / 2, band.heading, band.lines)"
          (blur)="hideTooltip()"
        />
      </svg>

      <svg
        *ngIf="data.chartType === 'area'"
        [attr.viewBox]="viewBox"
        class="w-full h-32"
        role="img"
        [attr.aria-label]="chartSummary(data)"
      >
        <ng-container *ngTemplateOutlet="axes; context: { data: data }"></ng-container>
        <polygon
          *ngFor="let series of data.series; let i = index"
          [attr.points]="areaPoints(data, i)"
          [attr.fill]="seriesColor(i)"
          fill-opacity="0.18"
          [attr.stroke]="seriesColor(i)"
          stroke-width="2"
        />
        <rect
          *ngFor="let band of hoverBands(data)"
          [attr.x]="band.x"
          [attr.y]="padTop"
          [attr.width]="band.width"
          [attr.height]="plotH"
          fill="transparent"
          tabindex="0"
          [attr.aria-label]="band.heading"
          (mouseenter)="showTooltip(band.key, band.x + band.width / 2, band.heading, band.lines)"
          (mouseleave)="hideTooltip()"
          (click)="toggleTooltip(band.key, band.x + band.width / 2, band.heading, band.lines)"
          (focus)="showTooltip(band.key, band.x + band.width / 2, band.heading, band.lines)"
          (blur)="hideTooltip()"
        />
      </svg>

      <svg
        *ngIf="data.chartType === 'bar'"
        [attr.viewBox]="viewBox"
        class="w-full h-32"
        role="img"
        [attr.aria-label]="chartSummary(data)"
      >
        <ng-container *ngTemplateOutlet="axes; context: { data: data }"></ng-container>
        <rect
          *ngFor="let bar of barRects(data)"
          [attr.x]="bar.x"
          [attr.y]="bar.y"
          [attr.width]="bar.width"
          [attr.height]="bar.height"
          [attr.fill]="bar.color"
          rx="1"
          tabindex="0"
          (mouseenter)="showTooltip(bar.key, bar.x + bar.width / 2, bar.label, [{ label: bar.seriesName, value: formatTick(bar.value), color: bar.color }])"
          (mouseleave)="hideTooltip()"
          (click)="toggleTooltip(bar.key, bar.x + bar.width / 2, bar.label, [{ label: bar.seriesName, value: formatTick(bar.value), color: bar.color }])"
          (focus)="showTooltip(bar.key, bar.x + bar.width / 2, bar.label, [{ label: bar.seriesName, value: formatTick(bar.value), color: bar.color }])"
          (blur)="hideTooltip()"
        >
          <title>{{ bar.seriesName }} — {{ bar.label }}: {{ bar.value }}</title>
        </rect>
      </svg>

      <svg
        *ngIf="data.chartType === 'scatter'"
        [attr.viewBox]="viewBox"
        class="w-full h-32"
        role="img"
        [attr.aria-label]="chartSummary(data)"
      >
        <ng-container *ngTemplateOutlet="axes; context: { data: data }"></ng-container>
        <circle
          *ngFor="let point of scatterPoints(data)"
          [attr.cx]="point.cx"
          [attr.cy]="point.cy"
          r="3"
          [attr.fill]="point.color"
          tabindex="0"
          (mouseenter)="showTooltip(point.key, point.cx, point.label, [{ label: point.seriesName, value: formatTick(point.value), color: point.color }])"
          (mouseleave)="hideTooltip()"
          (click)="toggleTooltip(point.key, point.cx, point.label, [{ label: point.seriesName, value: formatTick(point.value), color: point.color }])"
          (focus)="showTooltip(point.key, point.cx, point.label, [{ label: point.seriesName, value: formatTick(point.value), color: point.color }])"
          (blur)="hideTooltip()"
        >
          <title>{{ point.seriesName }} — {{ point.label }}: {{ point.value }}</title>
        </circle>
      </svg>

      <!-- Tooltip: a real positioned element, not just a native `<title>`, so
           it also works on tap (touch has no hover). -->
      <div
        *ngIf="tooltip() as t"
        class="pointer-events-none absolute top-0 z-10 -translate-x-1/2 px-2.5 py-1.5 rounded-lg bg-[#0a0d14]/95 border border-white/[0.12] shadow-lg"
        [style.left.%]="t.xPct"
        role="status"
      >
        <div class="text-xs15 font-semibold text-white whitespace-nowrap">{{ t.heading }}</div>
        <div *ngFor="let line of t.lines" class="flex items-center gap-1.5 mt-1 whitespace-nowrap">
          <span class="w-2 h-2 rounded-full shrink-0" [style.background]="line.color"></span>
          <span class="text-[10.5px] text-slate-300">{{ line.label }}: {{ line.value }}</span>
        </div>
      </div>
    </div>

    <div *ngIf="data.chartType === 'pie'" class="flex flex-col items-center gap-4" role="img" [attr.aria-label]="chartSummary(data)">
      <svg viewBox="0 0 100 100" class="w-32 h-32 shrink-0 -rotate-90" aria-hidden="true">
        <circle
          *ngFor="let slice of pieSlices(data)"
          cx="50"
          cy="50"
          r="40"
          fill="none"
          [attr.stroke]="slice.color"
          stroke-width="20"
          [attr.stroke-dasharray]="slice.dasharray"
          [attr.stroke-dashoffset]="slice.dashoffset"
        >
          <title>{{ slice.label }}: {{ slice.value }} ({{ slice.percent }}%)</title>
        </circle>
      </svg>
      <ul class="text-xs text-slate-300 space-y-2 w-full">
        <li *ngFor="let slice of pieSlices(data)" class="flex items-center gap-2 justify-center">
          <span class="w-3 h-3 rounded-full shrink-0" [style.background]="slice.color"></span>
          <span class="truncate">{{ slice.label }} — {{ slice.value }} ({{ slice.percent }}%)</span>
        </li>
      </ul>
    </div>

    <div *ngIf="data.chartType !== 'pie' && data.series.length > 1" class="flex flex-wrap gap-3 mt-4 pt-2 border-t border-white/5">
      <div *ngFor="let series of data.series; let i = index" class="flex items-center gap-2 text-xs text-slate-400">
        <span class="w-2.5 h-2.5 rounded-full shrink-0" [style.background]="seriesColor(i)"></span>
        <span>{{ series.name }}</span>
      </div>
    </div>
  </ng-container>

  <ng-template #emptyState>
    <div class="flex flex-col items-center justify-center gap-2 py-8 text-center" role="img" [attr.aria-label]="chartSummary(data)">
      <svg viewBox="0 0 24 24" class="w-8 h-8 text-slate-600" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 15l4-4 3 3 5-6" stroke-opacity="0.4" />
      </svg>
      <p class="text-xs text-slate-500">No data to display</p>
    </div>
  </ng-template>
</div>
