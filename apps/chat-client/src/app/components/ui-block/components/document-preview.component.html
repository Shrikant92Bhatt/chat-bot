<div class="rounded-2xl border border-white/10 bg-white/[0.03] p-4 max-w-md hover:border-white/20 hover:bg-white/[0.05] transition-all duration-200">
  <!-- Header -->
  <div class="flex items-start justify-between gap-2 mb-3">
    <div class="flex-1 min-w-0">
      <h3 class="text-sm font-semibold text-white truncate">{{ data.fileName }}</h3>
      <div *ngIf="data.pageCount" class="text-xs text-slate-400 mt-1">{{ data.pageCount }} page{{ data.pageCount !== 1 ? 's' : '' }}</div>
    </div>
    <span class="text-xl shrink-0">📄</span>
  </div>

  <!-- Excerpt -->
  <div *ngIf="data.excerpt" class="text-xs text-slate-400 mt-3 p-3 bg-white/[0.02] rounded-lg line-clamp-4 border border-white/5">
    {{ data.excerpt }}
  </div>

  <!-- CTA -->
  <a
    *ngIf="data.url"
    [href]="data.url"
    target="_blank"
    rel="noopener"
    class="inline-block text-xs font-semibold text-accentCyan hover:text-cyan-300 hover:bg-white/5 px-3 py-2 rounded-lg transition-colors duration-200 mt-3"
  >
    Open Document ↗
  </a>
</div>
