<div class="rounded-2xl border border-accentRose/30 bg-gradient-to-br from-accentRose/10 to-accentRose/5 p-4">
  <div class="flex items-start gap-3">
    <span class="text-xl shrink-0 mt-0.5">⚠️</span>
    <div class="flex-1 min-w-0">
      <div class="text-sm font-semibold text-accentRose">{{ data.title }}</div>
      <div class="text-sm text-rose-200/90 mt-2 leading-relaxed">{{ data.message }}</div>
      <div *ngIf="data.toolName" class="text-xs text-rose-300/70 mt-2 bg-white/5 px-2.5 py-1.5 rounded-lg inline-block">
        Tool: <span class="font-medium">{{ data.toolName }}</span>
      </div>
    </div>
  </div>
</div>
