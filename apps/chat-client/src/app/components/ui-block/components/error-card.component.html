<div class="rounded-2xl border border-accentRose/30 bg-accentRose/[0.08] p-4">
  <div class="flex items-center gap-2 text-accentRose text-sm font-medium">
    <span>⚠️</span>
    <span>{{ data.title }}</span>
  </div>
  <div class="text-xs text-rose-200/80 mt-1.5">{{ data.message }}</div>
  <div *ngIf="data.toolName" class="text-[10px] text-rose-300/60 mt-1">Tool: {{ data.toolName }}</div>
</div>
