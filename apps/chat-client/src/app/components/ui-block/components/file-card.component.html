<a
  [href]="data.url || null"
  target="_blank"
  rel="noopener"
  class="flex items-center gap-3 rounded-2xl border border-white/10 bg-white/[0.03] p-3 hover:bg-white/[0.05] transition-colors max-w-sm"
>
  <div class="w-9 h-9 rounded-lg bg-accentCyan/15 flex items-center justify-center text-accentCyan text-xs font-semibold shrink-0">
    {{ (data.fileType || data.fileName.split('.').pop() || 'FILE').slice(0, 4).toUpperCase() }}
  </div>
  <div class="min-w-0">
    <div class="text-sm text-slate-100 truncate">{{ data.fileName }}</div>
    <div class="text-[11px] text-slate-400">{{ formatBytes(data.sizeBytes) }}</div>
  </div>
</a>
