<div class="flex-1 flex flex-col h-full overflow-hidden relative">
  <!-- Ambient Backdrops -->
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Messages Stream Feed -->
  <div #scrollContainer (scroll)="onScroll()" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 relative z-10">
    <!-- Empty State Hero -->
    <div *ngIf="chatService.activeMessages().length === 0" class="h-full flex flex-col items-center justify-center text-center p-6 max-w-lg mx-auto">
      <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-accentCyan via-accentViolet to-indigo-600 p-0.5 shadow-glow mb-6 animate-pulse">
        <div class="w-full h-full bg-obsidian rounded-[22px] flex items-center justify-center">
          <svg class="w-8 h-8 text-accentCyan" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L5.6 15.11a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
          </svg>
        </div>
      </div>
      <h2 class="text-2xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent mb-2">
        Enterprise AI Intelligence
      </h2>
      <p class="text-sm text-slate-400 mb-6">
        Fast, intelligent responses. Switch response modes anytime from the bar above.
      </p>

      <!-- Prompt Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
        <button
          (click)="chatService.sendMessage('Design a scalable, automated deployment pipeline for a cloud-native app.')"
          class="p-4 glass-card glass-card-hover rounded-2xl text-left border border-glassBorder group"
        >
          <div class="text-xs font-semibold text-accentCyan group-hover:underline">Cloud Architecture</div>
          <div class="text-xs text-slate-300 mt-1">Design an automated, production-grade deployment pipeline.</div>
        </button>

        <button
          (click)="chatService.sendMessage('Explain how AI agents can call external tools and APIs.')"
          class="p-4 glass-card glass-card-hover rounded-2xl text-left border border-glassBorder group"
        >
          <div class="text-xs font-semibold text-accentViolet group-hover:underline">Tool Integration</div>
          <div class="text-xs text-slate-300 mt-1">Learn how AI agents can call external tools and APIs.</div>
        </button>
      </div>
    </div>

    <!-- Chat Messages -->
    <div *ngFor="let msg of chatService.activeMessages()" class="space-y-2">
      <!-- User Message -->
      <div *ngIf="msg.role === 'user'" class="group flex justify-end items-start space-x-3">
        <div class="flex flex-col items-end space-y-1 max-w-2xl">
          <div class="px-5 py-3.5 rounded-3xl bg-gradient-to-r from-accentViolet/30 to-indigo-600/30 border border-accentViolet/30 backdrop-blur-md shadow-glass text-slate-100 text-sm leading-relaxed">
            {{ msg.content }}
          </div>
          <button
            (click)="copyMessage(msg.id, msg.content)"
            class="flex items-center space-x-1 text-[11px] text-slate-400 hover:text-accentCyan transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100 pr-1"
          >
            <ng-container *ngIf="copiedMessageId() === msg.id; else userCopyIcon">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
              </svg>
              <span>Copied</span>
            </ng-container>
            <ng-template #userCopyIcon>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
              <span>Copy</span>
            </ng-template>
          </button>
        </div>
        <div class="w-8 h-8 rounded-xl bg-accentViolet/20 border border-accentViolet/40 flex items-center justify-center text-xs font-semibold text-violet-200 shadow-sm shrink-0">
          U
        </div>
      </div>

      <!-- Assistant Message -->
      <div *ngIf="msg.role === 'assistant'" class="group flex justify-start items-start space-x-3">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-accentCyan to-blue-600 flex items-center justify-center text-white shadow-glow shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>

        <div class="flex flex-col space-y-2 max-w-3xl">
          <div class="glass-card rounded-3xl p-5 border border-glassBorder shadow-glass text-slate-200 text-sm leading-relaxed space-y-2">
            <div class="flex items-center justify-between text-[11px] text-slate-400 mb-2 border-b border-white/5 pb-2">
              <span class="font-medium text-accentCyan">NexusAI ({{ msg.model || 'Gemini' }})</span>
              <span>{{ msg.timestamp | date:'mediumTime' }}</span>
            </div>

            <!-- Markdown HTML Output -->
            <div class="markdown-body" [innerHTML]="renderMarkdown(msg.content)"></div>

            <!-- Streaming Pulse Indicator -->
            <div *ngIf="chatService.isStreaming() && !msg.content" class="flex items-center space-x-2 py-2">
              <span class="w-2 h-2 rounded-full bg-accentCyan animate-ping"></span>
              <span class="text-xs text-slate-400">Synthesizing stream...</span>
            </div>

            <!-- Copy action -->
            <div *ngIf="msg.content && !(chatService.isStreaming() && !msg.content)" class="flex justify-end pt-1">
              <button
                (click)="copyMessage(msg.id, msg.content)"
                class="flex items-center space-x-1 text-[11px] text-slate-400 hover:text-accentCyan transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100"
              >
                <ng-container *ngIf="copiedMessageId() === msg.id; else assistantCopyIcon">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                  </svg>
                  <span>Copied</span>
                </ng-container>
                <ng-template #assistantCopyIcon>
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                  </svg>
                  <span>Copy</span>
                </ng-template>
              </button>
            </div>
          </div>

          <!-- Suggested Follow-up Questions -->
          <div
            *ngIf="msg.suggestions && msg.suggestions.length > 0 && !chatService.isStreaming()"
            class="flex flex-wrap gap-2"
          >
            <button
              *ngFor="let suggestion of msg.suggestions"
              (click)="chatService.sendMessage(suggestion)"
              class="px-3 py-1.5 rounded-full text-xs border border-glassBorder bg-white/5 hover:bg-white/10 hover:border-accentCyan/40 text-slate-300 hover:text-white transition-all"
            >
              {{ suggestion }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
