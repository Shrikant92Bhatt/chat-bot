<div class="flex-1 flex flex-col h-full overflow-hidden relative bg-obsidian">
  <!-- Messages Stream Feed -->
  <div
    #scrollContainer
    (scroll)="onScroll()"
    (wheel)="onUserScrollIntent()"
    (touchstart)="onUserScrollIntent()"
    class="flex-1 overflow-y-auto p-4 pb-24 md:p-8 md:pb-28 space-y-6 relative z-10"
  >
    <!-- Empty State Hero -->
    <div *ngIf="chatService.activeMessages().length === 0" class="h-full flex flex-col items-center justify-center text-center p-6 max-w-lg mx-auto">
      <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center mb-6">
        <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L5.6 15.11a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
        </svg>
      </div>
      <h2 class="text-xl font-medium text-slate-200 mb-2">How can I help you today?</h2>
    </div>

    <div class="max-w-3xl mx-auto space-y-6">
      <!-- Chat Messages -->
      <div *ngFor="let msg of chatService.activeMessages(); let last = last">
        <!-- User Message -->
        <div *ngIf="msg.role === 'user'" class="flex justify-end py-2 group">
          <div class="flex items-start gap-3 max-w-2xl">
            <div class="flex flex-col items-end gap-1 flex-1 min-w-0">
              <div class="text-[11px] text-slate-400 font-medium">{{ getUserDisplayName() }}</div>

              <!-- Attached photos/videos -->
              <div *ngIf="msg.attachments && msg.attachments.length > 0" class="flex flex-wrap justify-end gap-1.5 max-w-xs">
                <div *ngFor="let att of msg.attachments" class="w-24 h-24 rounded-xl overflow-hidden border border-white/10 bg-black/30 shrink-0">
                  <img
                    *ngIf="att.kind === 'image'"
                    [src]="att.url"
                    [alt]="att.fileName"
                    class="w-full h-full object-cover cursor-zoom-in"
                    (click)="openImage(att.url)"
                  />
                  <video *ngIf="att.kind === 'video'" [src]="att.url" class="w-full h-full object-cover" controls></video>
                </div>
              </div>

              <div *ngIf="msg.content" class="px-4 py-3 rounded-2xl bg-indigo-500/15 text-slate-100 text-sm leading-relaxed">
                {{ msg.content }}
              </div>
              <button
                *ngIf="msg.content"
                (click)="copyMessage(msg.id, msg.content)"
                class="flex items-center space-x-1 text-[11px] text-slate-400 hover:text-slate-300 transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100 pr-1 mt-1"
              >
                <ng-container *ngIf="copiedMessageId() === msg.id; else userCopyIcon">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                  </svg>
                  <span>Copied</span>
                </ng-container>
                <ng-template #userCopyIcon>
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                  </svg>
                  <span>Copy</span>
                </ng-template>
              </button>
            </div>
            <!-- Profile avatar -->
            <div class="w-7 h-7 rounded-full shrink-0 overflow-hidden bg-slate-800 flex items-center justify-center text-xs font-semibold text-slate-300">
              <img *ngIf="getUserPhotoURL()" [src]="getUserPhotoURL()" [alt]="getUserDisplayName()" class="w-full h-full object-cover" />
              <span *ngIf="!getUserPhotoURL()">{{ getUserInitial() }}</span>
            </div>
          </div>
        </div>

        <!-- Assistant Message -->
        <div *ngIf="msg.role === 'assistant'" class="flex flex-col py-2 group hover:bg-white/[0.02] transition-colors rounded-2xl -mx-4 px-4">
          <!-- Header: icon + name sit on their own row so the reply body below
               isn't permanently indented by an avatar column - the response
               gets the full container width instead of losing ~40px/line to
               a left gutter that only ever holds one small icon. -->
          <div class="flex items-center gap-2 mb-1.5">
            <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-accentCyan to-blue-600 flex items-center justify-center text-white shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
            </div>
            <div class="text-[11px] text-slate-400 font-medium">NexusAI</div>
          </div>
          <div class="flex flex-col gap-1 w-full min-w-0">
            <div class="text-slate-200 text-sm leading-relaxed">
                <!-- Structured UI components (weather/stock cards, tables, charts, ...) - shown
                     first, above the text: the card carries the at-a-glance answer, the Markdown
                     below is supporting detail, not the other way around. -->
                <app-ui-block
                  *ngIf="msg.ui && msg.ui.length > 0"
                  [components]="msg.ui"
                  [sources]="msg.sources || []"
                  [actions]="msg.actions || []"
                  (actionSelected)="chatService.sendMessage($event.label)"
                  class="block mb-3"
                ></app-ui-block>

                <!-- Markdown HTML Output -->
                <div class="markdown-body" [innerHTML]="renderMarkdown(msg.content)"></div>

                <!-- Streaming Pulse Indicator -->
                <div *ngIf="chatService.isStreaming() && !msg.content" class="flex items-center space-x-2 py-2">
                  <span class="w-2 h-2 rounded-full bg-slate-500 animate-ping"></span>
                </div>

                <!-- Generated Image: standalone card when it's the whole reply (dedicated Image mode) -->
                <div
                  *ngIf="msg.imageUrl && !msg.content"
                  class="mt-1 max-w-md rounded-2xl border border-white/10 bg-white/[0.03] overflow-hidden"
                >
                  <img
                    [src]="msg.imageUrl"
                    alt="Generated image"
                    class="w-full h-auto cursor-zoom-in"
                    (click)="openImage(msg.imageUrl)"
                    (load)="onContentLoad()"
                  />
                  <div class="flex items-center justify-between px-3 py-2 border-t border-white/5">
                    <span class="text-[11px] text-slate-400">Generated image</span>
                    <a
                      [href]="msg.imageUrl"
                      download="generated-image.png"
                      target="_blank"
                      rel="noopener"
                      class="text-[11px] text-slate-300 hover:text-white font-medium transition-colors"
                    >
                      Download
                    </a>
                  </div>
                </div>

                <!-- Generated Image: smaller inline treatment when it accompanies a text reply (tool call mid-chat) -->
                <div *ngIf="msg.imageUrl && msg.content" class="mt-3 max-w-sm">
                  <img
                    [src]="msg.imageUrl"
                    alt="Generated image"
                    class="rounded-xl border border-white/10 w-full h-auto cursor-zoom-in"
                    (click)="openImage(msg.imageUrl)"
                    (load)="onContentLoad()"
                  />
                  <div class="flex justify-end mt-1.5">
                    <a
                      [href]="msg.imageUrl"
                      download="generated-image.png"
                      target="_blank"
                      rel="noopener"
                      class="text-[11px] text-slate-400 hover:text-slate-300 transition-colors"
                    >
                      Download
                    </a>
                  </div>
                </div>
              </div>

              <!-- Copy action -->
              <div *ngIf="msg.content && !(chatService.isStreaming() && !msg.content)" class="flex items-center justify-start gap-3 pt-2">
                <button
                  (click)="copyMessage(msg.id, msg.content)"
                  class="flex items-center space-x-1 text-[11px] text-slate-400 hover:text-slate-300 transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100"
                >
                  <ng-container *ngIf="copiedMessageId() === msg.id; else assistantCopyIcon">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span>Copied</span>
                  </ng-container>
                  <ng-template #assistantCopyIcon>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    <span>Copy</span>
                  </ng-template>
                </button>

                <!-- Regenerate - only offered on the latest reply, since redoing an
                     older one would discard every message the user sent after it. -->
                <button
                  *ngIf="last"
                  (click)="chatService.regenerateLastResponse()"
                  class="flex items-center space-x-1 text-[11px] text-slate-400 hover:text-slate-300 transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                    />
                  </svg>
                  <span>Regenerate</span>
                </button>

                <!-- Share this response - device share sheet, falling back to clipboard. -->
                <button
                  (click)="shareMessage(msg.id, msg.content)"
                  class="flex items-center space-x-1 text-[11px] text-slate-400 hover:text-slate-300 transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M8.684 13.342a3 3 0 100 2.316m0-2.316a3 3 0 010-2.316m0 2.316l6.632 3.316m-6.632-5.632l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 8.632a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684z"
                    />
                  </svg>
                  <span *ngIf="shareFeedback()?.id !== msg.id">Share</span>
                  <span *ngIf="shareFeedback()?.id === msg.id">{{ shareFeedback()?.message }}</span>
                </button>
              </div>

              <!-- Suggested Follow-up Questions -->
              <div
                *ngIf="msg.suggestions && msg.suggestions.length > 0 && !chatService.isStreaming()"
                class="flex flex-wrap gap-2 mt-3"
              >
                <button
                  *ngFor="let suggestion of msg.suggestions"
                  (click)="chatService.sendMessage(suggestion)"
                  class="px-3 py-1.5 rounded-full text-xs bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition-all"
                >
                  {{ suggestion }}
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
