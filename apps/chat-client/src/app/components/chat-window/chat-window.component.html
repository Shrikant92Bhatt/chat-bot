<div class="flex-1 flex flex-col h-full overflow-hidden relative bg-obsidian">
  <!-- "New messages" jump button: shown instead of forcing a scroll when the
       user has scrolled away from the bottom while a reply is still streaming in. -->
  <button
    *ngIf="isScrolledAway() && chatService.isStreaming()"
    type="button"
    (click)="jumpToLatest()"
    class="absolute bottom-4 left-1/2 -translate-x-1/2 z-30 flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-slate-800 border border-white/10 text-xs font-medium text-slate-200 shadow-lg hover:bg-slate-700 transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accentCyan"
  >
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
    </svg>
    New messages
  </button>

  <!-- Messages Stream Feed -->
  <div
    #scrollContainer
    (scroll)="onScroll()"
    (wheel)="onUserScrollIntent()"
    (touchstart)="onUserScrollIntent()"
    class="flex-1 overflow-y-auto p-4 pb-24 md:p-8 md:pb-28 space-y-6 relative z-10"
  >
    <!-- Empty State Hero -->
    <div *ngIf="chatService.activeMessages().length === 0" class="h-full flex flex-col items-center justify-center text-center p-6 max-w-lg mx-auto">
      <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center mb-6">
        <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L5.6 15.11a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
        </svg>
      </div>
      <h2 class="text-xl font-medium text-slate-200 mb-2">How can I help you today?</h2>

      <!-- Capability example chips: fill the composer for review/edit, never auto-send. -->
      <div class="flex flex-wrap items-center justify-center gap-2 mt-4" role="group" aria-label="Example prompts">
        <button
          *ngFor="let chip of capabilityChips"
          type="button"
          (click)="useCapabilityChip(chip)"
          class="flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-medium bg-white/5 border border-white/10 text-slate-300 hover:text-white hover:bg-white/10 transition-all"
        >
          <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="chip.icon" />
          </svg>
          <span>{{ chip.label }}</span>
        </button>
      </div>
    </div>

    <div class="max-w-3xl mx-auto space-y-6">
      <!-- Chat Messages -->
      <div *ngFor="let msg of chatService.activeMessages(); let last = last">
        <!-- User Message -->
        <div *ngIf="msg.role === 'user'" class="flex justify-end py-2 group">
          <div class="flex items-start gap-3 max-w-2xl">
            <div class="flex flex-col items-end gap-1 flex-1 min-w-0">
              <div class="text-xs15 text-slate-400 font-medium">{{ getUserDisplayName() }}</div>

              <!-- Attached photos/videos -->
              <div *ngIf="msg.attachments && msg.attachments.length > 0" class="flex flex-wrap justify-end gap-1.5 max-w-xs">
                <div *ngFor="let att of msg.attachments" class="w-24 h-24 rounded-xl overflow-hidden border border-white/10 bg-black/30 shrink-0">
                  <img
                    *ngIf="att.kind === 'image'"
                    [src]="att.url"
                    [alt]="att.fileName"
                    class="w-full h-full object-cover cursor-zoom-in"
                    (click)="openImage(att.url)"
                  />
                  <video *ngIf="att.kind === 'video'" [src]="att.url" class="w-full h-full object-cover" controls></video>
                </div>
              </div>

              <div *ngIf="msg.content" class="px-4 py-3 rounded-2xl bg-indigo-500/15 text-slate-100 text-sm leading-relaxed">
                {{ msg.content }}
              </div>
              <div *ngIf="msg.content" class="flex items-center justify-end gap-3 pr-1 mt-1">
                <button
                  (click)="copyMessage(msg.id, msg.content)"
                  class="flex items-center space-x-1 text-xs15 text-slate-400 hover:text-slate-300 transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100 md:focus-visible:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accentCyan focus-visible:ring-offset-2 focus-visible:ring-offset-obsidian rounded-md"
                >
                  <ng-container *ngIf="copiedMessageId() === msg.id; else userCopyIcon">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span>Copied</span>
                  </ng-container>
                  <ng-template #userCopyIcon>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    <span>Copy</span>
                  </ng-template>
                </button>

                <!-- Edit - only offered on the LAST user message in the
                     thread, mirroring how Regenerate is only offered on the
                     last assistant reply: editing an earlier message would
                     invalidate summarizedThroughIndex (see
                     PROJECT_CONTEXT.md's Known gaps), which this app isn't
                     set up to handle yet. -->
                <button
                  *ngIf="chatService.isLastUserMessage(msg) && !chatService.isStreaming()"
                  (click)="chatService.startEditingMessage(msg)"
                  class="flex items-center space-x-1 text-xs15 text-slate-400 hover:text-slate-300 transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100 md:focus-visible:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accentCyan focus-visible:ring-offset-2 focus-visible:ring-offset-obsidian rounded-md"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                    />
                  </svg>
                  <span>Edit</span>
                </button>
              </div>
            </div>
            <!-- Profile avatar -->
            <div class="w-7 h-7 rounded-full shrink-0 overflow-hidden bg-slate-800 flex items-center justify-center text-xs font-semibold text-slate-300">
              <img *ngIf="getUserPhotoURL()" [src]="getUserPhotoURL()" [alt]="getUserDisplayName()" class="w-full h-full object-cover" />
              <span *ngIf="!getUserPhotoURL()">{{ getUserInitial() }}</span>
            </div>
          </div>
        </div>

        <!-- Assistant Message -->
        <div
          *ngIf="msg.role === 'assistant'"
          [attr.data-message-id]="msg.id"
          class="flex flex-col py-2 group hover:bg-white/[0.02] transition-colors rounded-2xl -mx-4 px-4"
        >
          <!-- Header: icon + name sit on their own row so the reply body below
               isn't permanently indented by an avatar column - the response
               gets the full container width instead of losing ~40px/line to
               a left gutter that only ever holds one small icon. -->
          <div class="flex items-center gap-2 mb-1.5">
            <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-accentCyan to-blue-600 flex items-center justify-center text-white shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
            </div>
            <div class="text-xs15 text-slate-400 font-medium">NexusAI</div>
          </div>
          <div class="flex flex-col gap-1 w-full min-w-0">
            <div class="text-slate-200 text-sm leading-relaxed">
                <!-- How this answer was researched. Above the answer, since
                     it happened first and explains the wait; collapses to one
                     line once the answer is there to read. -->
                <app-research-panel
                  *ngIf="researchTraceFor(msg) as trace"
                  [trace]="trace"
                  [live]="chatService.isStreaming() && isLastMessage(msg)"
                  class="block mb-3"
                ></app-research-panel>

                <!-- Structured UI components (weather/stock cards, tables, charts, ...) - shown
                     first, above the text: the card carries the at-a-glance answer, the Markdown
                     below is supporting detail, not the other way around. -->
                <app-ui-block
                  *ngIf="(msg.ui && msg.ui.length > 0) || (msg.pendingUi && msg.pendingUi.length > 0)"
                  [components]="msg.ui || []"
                  [pending]="msg.pendingUi || []"
                  [actions]="msg.actions || []"
                  (actionSelected)="actionDispatcher.dispatch($event)"
                  class="block mb-3"
                ></app-ui-block>

                <!-- Markdown HTML Output. sourceCount lets renderMarkdown() turn an
                     in-range inline [n] citation marker into a clickable chip that
                     jumps to the matching numbered entry in the Sources block below -
                     see citation-markers.ts. A message with no sources renders exactly
                     as before (sourceCount 0 -> renderCitationMarkers is a no-op). -->
                <div class="markdown-body" [innerHTML]="renderMarkdown(msg.content, msg.sources?.length || 0)"></div>

                <!-- Sources. Deliberately outside the card block above: a
                     researched answer is usually plain prose with no card,
                     and citations are exactly what the reader wants to check
                     on that kind of answer. Below the text, since they
                     support the answer rather than lead it. -->
                <div *ngIf="msg.sources && msg.sources.length > 0" class="mt-3 pt-3 border-t border-white/5">
                  <div class="text-xs2 uppercase tracking-wide text-slate-500 mb-1.5">Sources</div>
                  <div class="flex flex-wrap gap-1.5">
                    <a
                      *ngFor="let source of msg.sources; let i = index"
                      [href]="source.url || null"
                      target="_blank"
                      rel="noopener noreferrer"
                      [title]="source.url || ''"
                      [attr.data-source-index]="i + 1"
                      class="inline-flex items-center gap-1.5 max-w-[16rem] text-xs15 px-2.5 py-1 rounded-full bg-white/5 text-slate-400 hover:text-slate-100 hover:bg-white/10 transition-colors"
                    >
                      <span class="text-slate-500 shrink-0">{{ i + 1 }}</span>
                      <span class="truncate">{{ sourceLabel(source) }}</span>
                    </a>
                  </div>
                </div>

                <!-- Streaming indicator. Research and tool round-trips all
                     happen before the first token exists, so when the backend
                     says what it's doing, show that instead of a bare dot -
                     a named wait reads as progress, an anonymous one reads as
                     a hang. Only shown when app-research-panel above ISN'T
                     already rendered for this message - the panel's own
                     header carries the identical status text plus its own
                     pulsing indicator, so showing both duplicates the same
                     line. This stays visible only for the brief window
                     before the very first research_status event arrives, if
                     that window exists at all. -->
                <div *ngIf="chatService.isStreaming() && !msg.content && !researchTraceFor(msg)" class="flex items-center gap-2 py-2">
                  <span class="w-2 h-2 rounded-full bg-slate-500 animate-ping shrink-0"></span>
                  <span
                    *ngIf="chatService.activityStatus() as status"
                    class="text-xs15 text-slate-400 animate-pulse"
                  >{{ status }}</span>
                </div>

                <!-- Generated Image: standalone card when it's the whole reply (dedicated Image mode) -->
                <div
                  *ngIf="msg.imageUrl && !msg.content"
                  class="mt-1 max-w-md rounded-2xl border border-white/10 bg-white/[0.03] overflow-hidden"
                >
                  <img
                    [src]="msg.imageUrl"
                    alt="Generated image"
                    class="w-full h-auto cursor-zoom-in"
                    (click)="openImage(msg.imageUrl)"
                    (load)="onContentLoad()"
                  />
                  <div class="flex items-center justify-between px-3 py-2 border-t border-white/5">
                    <span class="text-xs15 text-slate-400">Generated image</span>
                    <a
                      [href]="msg.imageUrl"
                      download="generated-image.png"
                      target="_blank"
                      rel="noopener"
                      class="text-xs15 text-slate-300 hover:text-white font-medium transition-colors"
                    >
                      Download
                    </a>
                  </div>
                </div>

                <!-- Generated Image: smaller inline treatment when it accompanies a text reply (tool call mid-chat) -->
                <div *ngIf="msg.imageUrl && msg.content" class="mt-3 max-w-sm">
                  <img
                    [src]="msg.imageUrl"
                    alt="Generated image"
                    class="rounded-xl border border-white/10 w-full h-auto cursor-zoom-in"
                    (click)="openImage(msg.imageUrl)"
                    (load)="onContentLoad()"
                  />
                  <div class="flex justify-end mt-1.5">
                    <a
                      [href]="msg.imageUrl"
                      download="generated-image.png"
                      target="_blank"
                      rel="noopener"
                      class="text-xs15 text-slate-400 hover:text-slate-300 transition-colors"
                    >
                      Download
                    </a>
                  </div>
                </div>
              </div>

              <!-- Copy action -->
              <div *ngIf="msg.content && !(chatService.isStreaming() && !msg.content)" class="flex items-center justify-start gap-3 pt-2">
                <button
                  (click)="copyMessage(msg.id, msg.content)"
                  class="flex items-center space-x-1 text-xs15 text-slate-400 hover:text-slate-300 transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100 md:focus-visible:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accentCyan focus-visible:ring-offset-2 focus-visible:ring-offset-obsidian rounded-md"
                >
                  <ng-container *ngIf="copiedMessageId() === msg.id; else assistantCopyIcon">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span>Copied</span>
                  </ng-container>
                  <ng-template #assistantCopyIcon>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    <span>Copy</span>
                  </ng-template>
                </button>

                <!-- Regenerate - only offered on the latest reply, since redoing an
                     older one would discard every message the user sent after it. -->
                <button
                  *ngIf="last"
                  (click)="chatService.regenerateLastResponse()"
                  class="flex items-center space-x-1 text-xs15 text-slate-400 hover:text-slate-300 transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100 md:focus-visible:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accentCyan focus-visible:ring-offset-2 focus-visible:ring-offset-obsidian rounded-md"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                    />
                  </svg>
                  <span>Regenerate</span>
                </button>

                <!-- Share this response - device share sheet, falling back to clipboard. -->
                <button
                  (click)="shareMessage(msg.id, msg.content)"
                  class="flex items-center space-x-1 text-xs15 text-slate-400 hover:text-slate-300 transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100 md:focus-visible:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accentCyan focus-visible:ring-offset-2 focus-visible:ring-offset-obsidian rounded-md"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M8.684 13.342a3 3 0 100 2.316m0-2.316a3 3 0 010-2.316m0 2.316l6.632 3.316m-6.632-5.632l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 8.632a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684z"
                    />
                  </svg>
                  <span *ngIf="shareFeedback()?.id !== msg.id">Share</span>
                  <span *ngIf="shareFeedback()?.id === msg.id">{{ shareFeedback()?.message }}</span>
                </button>

                <!-- Feedback: thumbs up/down on this response. Re-clicking the
                     already-selected thumb clears the rating (toggle off) -
                     see ChatService.rateMessage / message-feedback.util.ts. -->
                <button
                  type="button"
                  (click)="rateMessage(msg, 'up')"
                  [attr.aria-pressed]="ratingFor(msg) === 'up'"
                  [attr.aria-label]="ratingFor(msg) === 'up' ? 'Remove helpful rating' : 'Mark this response as helpful'"
                  [class.text-accentCyan]="ratingFor(msg) === 'up'"
                  class="flex items-center space-x-1 text-xs15 text-slate-400 hover:text-slate-300 transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100 md:focus-visible:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accentCyan focus-visible:ring-offset-2 focus-visible:ring-offset-obsidian rounded-md"
                >
                  <svg class="w-3.5 h-3.5" [attr.fill]="ratingFor(msg) === 'up' ? 'currentColor' : 'none'" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"
                    />
                  </svg>
                </button>

                <button
                  type="button"
                  (click)="rateMessage(msg, 'down')"
                  [attr.aria-pressed]="ratingFor(msg) === 'down'"
                  [attr.aria-label]="ratingFor(msg) === 'down' ? 'Remove not-helpful rating' : 'Mark this response as not helpful'"
                  [class.text-accentCyan]="ratingFor(msg) === 'down'"
                  class="flex items-center space-x-1 text-xs15 text-slate-400 hover:text-slate-300 transition-colors opacity-100 md:opacity-0 md:group-hover:opacity-100 md:focus-visible:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accentCyan focus-visible:ring-offset-2 focus-visible:ring-offset-obsidian rounded-md"
                >
                  <svg class="w-3.5 h-3.5" [attr.fill]="ratingFor(msg) === 'down' ? 'currentColor' : 'none'" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"
                    />
                  </svg>
                </button>
              </div>

              <!-- Suggested Follow-up Questions -->
              <div
                *ngIf="msg.suggestions && msg.suggestions.length > 0 && !chatService.isStreaming()"
                class="flex flex-wrap gap-2 mt-3"
              >
                <button
                  *ngFor="let suggestion of msg.suggestions"
                  (click)="actionDispatcher.dispatchLabel(suggestion)"
                  class="px-3 py-1.5 rounded-full text-xs bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition-all"
                >
                  {{ suggestion }}
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
