<header class="h-16 px-3 sm:px-6 flex items-center justify-between z-30 bg-obsidian border-b border-white/5">
  <!-- Left: Brand & Sidebar Toggle -->
  <div class="flex items-center space-x-2 sm:space-x-4">
    <button
      *ngIf="authService.userSignal()"
      (click)="toggleSidebar.emit()"
      class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all duration-200"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <div class="flex items-center space-x-2">
      <div class="text-lg font-semibold tracking-tight text-slate-200">
        NexusAI
      </div>
    </div>
  </div>

  <!-- Right: Settings & Profile -->
  <div class="flex items-center space-x-2 sm:space-x-4">
    <button (click)="openSettings.emit()" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all" title="Settings">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </button>

    <ng-container *ngIf="authService.userSignal() as user; else loginBtn">
      <div class="flex items-center space-x-3 pl-2 border-l border-white/5">
        <img [src]="user.photoURL" [alt]="user.displayName" class="w-7 h-7 rounded-full" />
      </div>
    </ng-container>

    <ng-template #loginBtn>
      <button
        (click)="authService.loginWithGoogle()"
        class="px-4 py-1.5 rounded-xl bg-white/10 hover:bg-white/15 text-white text-sm font-medium transition-all"
      >
        Sign In
      </button>
    </ng-template>
  </div>
</header>
