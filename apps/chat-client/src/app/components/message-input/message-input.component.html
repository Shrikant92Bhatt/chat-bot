<div class="px-2 sm:px-3 md:px-4 pb-[calc(0.5rem+env(safe-area-inset-bottom))] relative z-20 bg-[var(--color-bg-primary)]">
  <div class="max-w-4xl mx-auto">
    <form (ngSubmit)="send()" class="relative flex flex-col bg-[var(--color-surface-primary)] border border-[var(--color-border-light)] rounded-lg sm:rounded-lg p-2 sm:p-3 shadow-md focus-within:border-[var(--color-accent-primary)] focus-within:shadow-lg transition-all">
      <!-- Top row: Chat/Image mode tabs + model selector, inside the same input box -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between px-1 pb-1.5 gap-2">
        <div class="flex items-center gap-1 sm:gap-2">
        <!-- Scoped-to-project badge: this conversation gets the project's instructions + files -->
        <!-- Project Badge -->
        <span
          *ngIf="activeProjectName() as projectName"
          [title]="'This conversation uses the ' + projectName + ' project instructions and files'"
          class="flex items-center gap-1 px-2 py-1 rounded-md bg-[var(--color-surface-secondary)] border border-[var(--color-border-light)] text-xs text-[var(--color-text-secondary)] max-w-[9rem]"
        >
          <svg class="w-3 h-3 text-[var(--color-text-tertiary)] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
          </svg>
          <span class="truncate">{{ projectName }}</span>
        </span>
        <!-- Mode Selector -->
        <div class="flex items-center gap-1 bg-[var(--color-surface-secondary)] rounded-md p-1">
          <button
            type="button"
            (click)="setMode('chat')"
            [class]="chatService.chatMode() === 'chat' ? 'bg-[var(--color-surface-active)] text-[var(--color-text-primary)]' : 'text-[var(--color-text-tertiary)] hover:text-[var(--color-text-secondary)]'"
            class="px-3 py-1 rounded text-xs font-medium transition-all"
          >
            Chat
          </button>
          <button
            type="button"
            (click)="setMode('image')"
            [class]="chatService.chatMode() === 'image' ? 'bg-[var(--color-surface-active)] text-[var(--color-text-primary)]' : 'text-[var(--color-text-tertiary)] hover:text-[var(--color-text-secondary)]'"
            class="flex items-center gap-1 px-3 py-1 rounded text-xs font-medium transition-all"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14M14 8h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            Image
          </button>
          <button
            type="button"
            (click)="setMode('video')"
            [class]="chatService.chatMode() === 'video' ? 'bg-[var(--color-surface-active)] text-[var(--color-text-primary)]' : 'text-[var(--color-text-tertiary)] hover:text-[var(--color-text-secondary)]'"
            class="flex items-center gap-1 px-3 py-1 rounded text-xs font-medium transition-all"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            Video
          </button>
        </div>
        </div>

        <!-- Model Selector -->
        <div *ngIf="chatService.chatMode() === 'chat'" class="model-selector relative w-full sm:w-auto">
          <button
            type="button"
            (click)="toggleModelDropdown()"
            (keydown)="onModelDropdownKeydown($event)"
            aria-haspopup="listbox"
            [attr.aria-expanded]="isModelDropdownOpen"
            aria-label="Select model"
            class="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-2.5 py-1 rounded-md bg-[var(--color-surface-secondary)] border border-[var(--color-border-light)] hover:bg-[var(--color-surface-hover)] transition-all text-xs font-medium text-[var(--color-text-secondary)] w-full sm:w-auto justify-between sm:justify-start focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-accent-primary)] focus-visible:ring-offset-1 focus-visible:ring-offset-[var(--color-bg-primary)]"
          >
            <span>{{ getModelDisplayName() }}</span>
            <svg class="w-3.5 h-3.5 text-[var(--color-text-tertiary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <div
            *ngIf="isModelDropdownOpen"
            role="listbox"
            (keydown)="onModelDropdownKeydown($event)"
            class="absolute bottom-full mb-1.5 left-0 sm:right-0 sm:left-auto w-full sm:w-64 max-h-64 sm:max-h-80 overflow-y-auto bg-[var(--color-surface-primary)] border border-[var(--color-border-light)] rounded-lg shadow-lg z-50 py-1"
          >
            <div *ngFor="let group of groupedModels()">
              <div class="px-4 pt-2 pb-1 text-xs2 font-semibold uppercase tracking-wide text-slate-500">{{ group.provider }}</div>
              <button
                *ngFor="let m of group.models"
                type="button"
                (click)="selectModel(m.id)"
                (mouseenter)="highlightedModelId = m.id"
                (mouseleave)="highlightedModelId = null"
                role="option"
                [attr.aria-selected]="chatService.selectedModel() === m.id"
                [disabled]="m.usage?.disabled"
                [title]="m.usage?.disabled ? ('Daily limit reached — ' + modelResetLabel(m.usage!.resetAt)) : ''"
                class="w-full text-left px-4 py-2 text-sm transition-colors flex items-center justify-between gap-2"
                [ngClass]="(isModelHighlighted(m.id) || chatService.selectedModel() === m.id) ? (m.usage?.disabled ? 'bg-white/5 text-slate-600' : 'bg-white/10 text-white') : (m.usage?.disabled ? 'text-slate-600 cursor-not-allowed' : 'text-slate-300 hover:bg-white/10 hover:text-white')"
              >
                <span class="flex items-center gap-1.5 min-w-0">
                  <span class="truncate">{{ m.name }}</span>
                  <span
                    *ngIf="tokenTier(m) as tier"
                    [title]="tier + ' relative token cost'"
                    class="shrink-0 px-1.5 py-0.5 rounded-full text-xs3 font-semibold leading-none"
                    [ngClass]="tokenTierClass(tier)"
                  >{{ tokenTierLabel(tier) }}</span>
                </span>
                <span *ngIf="m.usage?.disabled" class="text-xs2 text-slate-600 shrink-0">limit reached</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Video Model Selector -->
        <div *ngIf="chatService.chatMode() === 'video'" class="video-model-selector relative w-full sm:w-auto">
          <button
            type="button"
            (click)="toggleVideoModelDropdown()"
            aria-haspopup="listbox"
            [attr.aria-expanded]="isVideoModelDropdownOpen"
            aria-label="Select video model"
            class="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-2.5 py-1 rounded-md bg-[var(--color-surface-secondary)] border border-[var(--color-border-light)] hover:bg-[var(--color-surface-hover)] transition-all text-xs font-medium text-[var(--color-text-secondary)] w-full sm:w-auto justify-between sm:justify-start focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-accent-primary)] focus-visible:ring-offset-1 focus-visible:ring-offset-[var(--color-bg-primary)]"
          >
            <span>{{ getVideoModelDisplayName() }}</span>
            <svg class="w-3.5 h-3.5 text-[var(--color-text-tertiary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <div
            *ngIf="isVideoModelDropdownOpen"
            role="listbox"
            class="absolute bottom-full mb-1.5 left-0 sm:right-0 sm:left-auto w-full sm:w-64 max-h-64 sm:max-h-80 overflow-y-auto bg-[var(--color-surface-primary)] border border-[var(--color-border-light)] rounded-lg shadow-lg z-50 py-1"
          >
            <div *ngFor="let group of videoModelGroups()">
              <div class="px-4 pt-2 pb-1 text-xs2 font-semibold uppercase tracking-wide text-slate-500">{{ group.provider }}</div>
              <button
                *ngFor="let m of group.models"
                type="button"
                (click)="selectVideoModel(m.id)"
                role="option"
                [attr.aria-selected]="chatService.selectedVideoModel() === m.id"
                class="w-full text-left px-4 py-2 text-sm transition-colors flex items-center justify-between gap-2"
                [ngClass]="chatService.selectedVideoModel() === m.id ? 'bg-white/10 text-white' : 'text-slate-300 hover:bg-white/10 hover:text-white'"
              >
                <span class="truncate">{{ m.name }}</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Editing Indicator -->
      <div
        *ngIf="chatService.editingMessageId()"
        class="flex items-center justify-between px-2 pb-1.5 text-xs text-[var(--color-accent-primary)]"
      >
        <span class="flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          Editing message
        </span>
        <button
          type="button"
          (click)="cancelEdit()"
          aria-label="Cancel editing"
          title="Cancel editing"
          class="p-1.5 rounded-lg text-[var(--color-text-tertiary)] hover:text-[var(--color-text-primary)] hover:bg-[var(--color-surface-secondary)] transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-accent-primary)] focus-visible:ring-offset-1 focus-visible:ring-offset-[var(--color-bg-primary)]"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Textarea + Action Buttons -->
      <div class="flex items-end pr-1 gap-1 sm:gap-2">
        <!-- File Attachment Button (also used in Video mode to stage reference images) -->
        <button
          *ngIf="chatService.chatMode() === 'chat' || chatService.chatMode() === 'video'"
          type="button"
          (click)="fileInput.click()"
          [disabled]="chatService.isUploadingDocument() || chatService.isUploadingAttachments()"
          [title]="chatService.chatMode() === 'video' ? 'Attach reference images' : 'Attach a file, photo, or video'"
          [attr.aria-label]="chatService.chatMode() === 'video' ? 'Attach reference images' : 'Attach a file, photo, or video'"
          class="p-1.5 rounded-lg text-[var(--color-text-tertiary)] hover:text-[var(--color-text-primary)] hover:bg-[var(--color-surface-secondary)] disabled:opacity-40 transition-all flex items-center justify-center shrink-0 touch-target focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-accent-primary)] focus-visible:ring-offset-1 focus-visible:ring-offset-[var(--color-bg-primary)]"
        >
          <svg
            *ngIf="!chatService.isUploadingDocument() && !chatService.isUploadingAttachments()"
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
          </svg>
          <svg *ngIf="chatService.isUploadingDocument() || chatService.isUploadingAttachments()" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>
        <input
          #fileInput
          type="file"
          hidden
          multiple
          accept=".txt,.md,.csv,.json,.pdf,image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif,video/mp4,video/quicktime,video/webm"
          (change)="onFileSelected($event)"
        />

        <!-- Message Textarea -->
        <textarea
          #messageTextarea
          [(ngModel)]="messageText"
          name="messageText"
          (keydown.enter)="onKeydown($event)"
          (keydown.escape)="onEscapeKey()"
          (input)="autoGrow()"
          rows="1"
          [attr.aria-label]="chatService.editingMessageId() ? 'Edit message' : 'Message'"
          [placeholder]="placeholder"
          class="flex-1 bg-transparent border-0 focus:ring-0 text-[var(--color-text-primary)] placeholder-[var(--color-text-muted)] text-base sm:text-sm px-2 sm:px-3 py-2 resize-none max-h-32 sm:max-h-36 overflow-y-auto focus:outline-none prevent-auto-zoom"
        ></textarea>
        <div class="flex items-center gap-1 sm:gap-2 shrink-0 pb-1">
          <!-- Dictation Button -->
          <button
            *ngIf="speechSupported"
            type="button"
            (click)="toggleDictation()"
            [disabled]="chatService.isStreaming()"
            [title]="isListening ? 'Stop dictation' : 'Dictate message'"
            [attr.aria-label]="isListening ? 'Stop dictation' : 'Dictate message'"
            [attr.aria-pressed]="isListening"
            class="p-1.5 rounded-lg disabled:opacity-40 transition-all flex items-center justify-center touch-target focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-accent-primary)] focus-visible:ring-offset-1 focus-visible:ring-offset-[var(--color-bg-primary)]"
            [ngClass]="isListening ? 'bg-[var(--color-accent-danger)]/20 text-[var(--color-accent-danger)] animate-pulse' : 'text-[var(--color-text-tertiary)] hover:text-[var(--color-text-primary)] hover:bg-[var(--color-surface-secondary)]'"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
            </svg>
          </button>

          <!-- Stop Streaming Button -->
          <button
            *ngIf="chatService.isStreaming()"
            type="button"
            (click)="chatService.stopStreaming()"
            class="p-1.5 rounded-lg bg-[var(--color-surface-active)] hover:bg-[var(--color-surface-hover)] text-[var(--color-text-primary)] transition-all flex items-center justify-center touch-target focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-accent-primary)] focus-visible:ring-offset-1 focus-visible:ring-offset-[var(--color-bg-primary)]"
            title="Stop generating"
            aria-label="Stop generating"
          >
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <rect x="6" y="6" width="12" height="12" rx="2" />
            </svg>
          </button>

          <!-- Send Button -->
          <button
            *ngIf="!chatService.isStreaming()"
            type="submit"
            [disabled]="!messageText.trim() && chatService.stagedAttachments().length === 0"
            [attr.aria-label]="chatService.editingMessageId() ? 'Save edit and resend' : 'Send message'"
            class="p-1.5 rounded-lg bg-[var(--color-accent-primary)] text-[var(--color-bg-primary)] disabled:opacity-40 disabled:cursor-not-allowed hover:bg-cyan-400 transition-all flex items-center justify-center touch-target focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-accent-primary)] focus-visible:ring-offset-1 focus-visible:ring-offset-[var(--color-bg-primary)] font-medium"
          >
            <svg class="w-4 h-4 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Photos/videos staged for this message -->
      <div *ngIf="chatService.stagedAttachments().length > 0" class="flex flex-wrap gap-1.5 sm:gap-2 px-1 pt-2">
        <div *ngFor="let att of chatService.stagedAttachments()" class="relative w-12 sm:w-14 h-12 sm:h-14 rounded-lg overflow-hidden bg-black/30 border border-white/10 group/att">
          <img *ngIf="att.kind === 'image'" [src]="att.url" [alt]="att.fileName" class="w-full h-full object-cover" />
          <video *ngIf="att.kind === 'video'" [src]="att.url" class="w-full h-full object-cover" muted></video>
          <button
            type="button"
            (click)="chatService.removeStagedAttachment(att.id)"
            title="Remove attachment"
            aria-label="Remove attachment"
            class="absolute top-0.5 right-0.5 w-4 h-4 rounded-full bg-black/70 text-white flex items-center justify-center text-xs2 leading-none opacity-100 md:opacity-0 md:group-hover/att:opacity-100 md:focus-visible:opacity-100 transition-opacity focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accentCyan"
          >
            ✕
          </button>
        </div>
      </div>
      <div *ngIf="chatService.attachmentUploadError()" class="px-1 pt-2 text-xs15 text-red-400">
        {{ chatService.attachmentUploadError() }}
      </div>

      <!-- Uploaded knowledge-base document chips -->
      <div *ngIf="chatService.uploadedDocuments().length > 0" class="flex flex-wrap gap-1.5 px-1 pt-2">
        <span
          *ngFor="let doc of chatService.uploadedDocuments()"
          class="flex items-center gap-1 px-2 py-1 rounded-full bg-white/5 text-xs15 text-slate-300"
        >
          <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          {{ doc }}
        </span>
      </div>
      <div *ngIf="chatService.documentUploadError()" class="px-1 pt-2 text-xs15 text-red-400">
        {{ chatService.documentUploadError() }}
      </div>
    </form>
    <div class="text-center text-xs2 text-slate-500 mt-2 px-4">
      NexusAI can make mistakes. Check important info.
    </div>
  </div>
</div>
