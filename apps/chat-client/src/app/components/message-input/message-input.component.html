<div class="p-3 pb-[calc(1.875rem+env(safe-area-inset-bottom))] md:p-4 relative z-20">
  <div class="max-w-3xl mx-auto">
    <form (ngSubmit)="send()" class="relative flex flex-col bg-slate-800/50 border border-white/10 rounded-2xl p-2 shadow-lg focus-within:border-slate-500/50 transition-all">
      <!-- Top row: Chat/Image mode tabs + model selector, inside the same input box -->
      <div class="flex items-center justify-between px-1 pb-1.5">
        <div class="flex items-center gap-2">
        <!-- Scoped-to-project badge: this conversation gets the project's instructions + files -->
        <span
          *ngIf="activeProjectName() as projectName"
          [title]="'This conversation uses the ' + projectName + ' project instructions and files'"
          class="flex items-center gap-1 px-2 py-1 rounded-full bg-white/5 border border-white/10 text-[11px] text-slate-300 max-w-[9rem]"
        >
          <svg class="w-3 h-3 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
          </svg>
          <span class="truncate">{{ projectName }}</span>
        </span>
        <div class="flex items-center gap-0.5 bg-black/20 rounded-full p-0.5">
          <button
            type="button"
            (click)="setMode('chat')"
            [class]="chatService.chatMode() === 'chat' ? 'bg-white/10 text-white' : 'text-slate-400 hover:text-white'"
            class="px-3 py-1 rounded-full text-xs font-medium transition-all"
          >
            Chat
          </button>
          <button
            type="button"
            (click)="setMode('image')"
            [class]="chatService.chatMode() === 'image' ? 'bg-white/10 text-white' : 'text-slate-400 hover:text-white'"
            class="flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium transition-all"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14M14 8h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            Image
          </button>
        </div>
        </div>

        <!-- Model Selector: only meaningful in Chat mode - image generation always uses the fixed image model -->
        <div *ngIf="chatService.chatMode() === 'chat'" class="model-selector relative">
          <button
            type="button"
            (click)="isModelDropdownOpen = !isModelDropdownOpen"
            class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/5 border border-white/5 hover:bg-white/10 transition-all text-xs font-medium text-slate-300"
          >
            <span>{{ getModelDisplayName() }}</span>
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <div
            *ngIf="isModelDropdownOpen"
            class="absolute bottom-full mb-1.5 right-0 w-48 bg-slate-900 border border-white/10 rounded-xl shadow-xl overflow-hidden z-50 py-1"
          >
            <button
              *ngFor="let m of availableModels()"
              type="button"
              (click)="selectModel(m.id)"
              class="w-full text-left px-4 py-2 text-sm text-slate-300 hover:bg-white/10 hover:text-white transition-colors"
            >
              {{ m.name }}
            </button>
          </div>
        </div>
      </div>

      <!-- Textarea + action buttons -->
      <div class="flex items-end pr-1">
        <!-- Attach a knowledge-base document, or a photo/video to this message (Chat mode only) -->
        <button
          *ngIf="chatService.chatMode() === 'chat'"
          type="button"
          (click)="fileInput.click()"
          [disabled]="chatService.isUploadingDocument() || chatService.isUploadingAttachments()"
          title="Attach a file, photo, or video"
          class="p-2 ml-1 mb-1 rounded-full text-slate-400 hover:text-white hover:bg-white/5 disabled:opacity-40 transition-all flex items-center justify-center shrink-0"
        >
          <svg
            *ngIf="!chatService.isUploadingDocument() && !chatService.isUploadingAttachments()"
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
          </svg>
          <svg *ngIf="chatService.isUploadingDocument() || chatService.isUploadingAttachments()" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>
        <input
          #fileInput
          type="file"
          hidden
          multiple
          accept=".txt,.md,.csv,.json,.pdf,image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif,video/mp4,video/quicktime,video/webm"
          (change)="onFileSelected($event)"
        />

        <textarea
          [(ngModel)]="messageText"
          name="messageText"
          (keydown.enter)="onKeydown($event)"
          rows="1"
          [placeholder]="placeholder"
          class="flex-1 bg-transparent border-0 focus:ring-0 text-slate-100 placeholder-slate-400 text-sm px-3 py-2 resize-none max-h-36 overflow-y-auto focus:outline-none"
        ></textarea>
        <div class="flex items-center gap-2 shrink-0 pb-1">
          <!-- Stop Streaming Button -->
          <button
            *ngIf="chatService.isStreaming()"
            type="button"
            (click)="chatService.stopStreaming()"
            class="p-2 rounded-full bg-slate-700 hover:bg-slate-600 text-slate-200 transition-all flex items-center justify-center"
            title="Stop generating"
          >
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <rect x="6" y="6" width="12" height="12" rx="2" />
            </svg>
          </button>

          <!-- Send Button -->
          <button
            *ngIf="!chatService.isStreaming()"
            type="submit"
            [disabled]="!messageText.trim() && chatService.stagedAttachments().length === 0"
            class="p-2 rounded-full bg-white text-slate-900 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-200 transition-all flex items-center justify-center"
          >
            <svg class="w-4 h-4 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Photos/videos staged for this message -->
      <div *ngIf="chatService.stagedAttachments().length > 0" class="flex flex-wrap gap-2 px-1 pt-2">
        <div *ngFor="let att of chatService.stagedAttachments()" class="relative w-14 h-14 rounded-lg overflow-hidden bg-black/30 border border-white/10 group/att">
          <img *ngIf="att.kind === 'image'" [src]="att.url" [alt]="att.fileName" class="w-full h-full object-cover" />
          <video *ngIf="att.kind === 'video'" [src]="att.url" class="w-full h-full object-cover" muted></video>
          <button
            type="button"
            (click)="chatService.removeStagedAttachment(att.id)"
            title="Remove"
            class="absolute top-0.5 right-0.5 w-4 h-4 rounded-full bg-black/70 text-white flex items-center justify-center text-[10px] leading-none opacity-0 group-hover/att:opacity-100 transition-opacity"
          >
            ✕
          </button>
        </div>
      </div>
      <div *ngIf="chatService.attachmentUploadError()" class="px-1 pt-2 text-[11px] text-red-400">
        {{ chatService.attachmentUploadError() }}
      </div>

      <!-- Uploaded knowledge-base document chips -->
      <div *ngIf="chatService.uploadedDocuments().length > 0" class="flex flex-wrap gap-1.5 px-1 pt-2">
        <span
          *ngFor="let doc of chatService.uploadedDocuments()"
          class="flex items-center gap-1 px-2 py-1 rounded-full bg-white/5 text-[11px] text-slate-300"
        >
          <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          {{ doc }}
        </span>
      </div>
      <div *ngIf="chatService.documentUploadError()" class="px-1 pt-2 text-[11px] text-red-400">
        {{ chatService.documentUploadError() }}
      </div>
    </form>
    <div class="text-center text-[10px] text-slate-500 mt-2 px-4">
      NexusAI can make mistakes. Check important info.
    </div>
  </div>
</div>
