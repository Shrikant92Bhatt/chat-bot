<div
  class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 w-full max-w-lg px-4"
  role="alert"
  aria-live="assertive"
>
  <div *ngIf="authService.loginError() as err" class="glass-card rounded-2xl p-4 border border-red-500/40 bg-slate-950/90 shadow-glass flex items-start gap-3.5 backdrop-blur-xl">
    <div class="p-2 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 flex-shrink-0 mt-0.5">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between gap-2 mb-1">
        <h4 class="text-sm font-semibold text-white tracking-tight">{{ err.title }}</h4>
        <span class="text-[10px] font-mono font-medium px-2 py-0.5 rounded-md bg-slate-800 text-cyan-400 border border-slate-700">
          {{ err.refId }}
        </span>
      </div>
      <p class="text-xs text-slate-300 leading-relaxed">{{ err.message }}</p>
      <p class="text-xs text-slate-400 mt-1 italic">{{ err.suggestion }}</p>
      <div class="mt-3 flex items-center gap-3 border-t border-white/10 pt-2.5">
        <button
          (click)="retry()"
          class="text-xs font-semibold text-cyan-400 hover:text-cyan-300 transition-colors cursor-pointer flex items-center gap-1"
        >
          <span>↻</span> Try again
        </button>
        <button
          (click)="dismiss()"
          class="text-xs text-slate-400 hover:text-slate-200 transition-colors cursor-pointer"
        >
          Dismiss
        </button>
      </div>
    </div>
  </div>
</div>
