<aside
  [class.translate-x-0]="isOpen"
  [class.-translate-x-full]="!isOpen"
  [class.lg:w-64]="isOpen"
  [class.lg:w-0]="!isOpen"
  [class.lg:border-r-0]="!isOpen"
  class="w-64 bg-obsidian border-r border-white/5 flex flex-col transition-[transform,width] duration-300 ease-in-out absolute lg:relative lg:translate-x-0 z-20 h-[calc(100vh-4rem)] overflow-hidden"
>
  <!-- Mobile close button - hidden on lg and above -->
  <div class="flex items-center justify-between px-3 py-2 lg:hidden border-b border-white/5">
    <span class="text-xs font-semibold text-slate-400">Menu</span>
    <button
      (click)="closeSidebar.emit()"
      aria-label="Close sidebar"
      title="Close menu"
      class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accentCyan"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="p-3">
    <button
      (click)="createNewThread()"
      aria-label="New chat"
      class="w-full py-2.5 px-3 rounded-xl hover:bg-white/5 flex items-center space-x-2 text-sm font-medium transition-all text-slate-200"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span>New Chat</span>
    </button>
  </div>

  <!-- Projects: custom instructions + project-scoped files -->
  <div class="px-2 pb-2">
    <div class="flex items-center justify-between px-3 pb-1">
      <span class="text-xs15 font-semibold uppercase tracking-wide text-slate-500">Projects</span>
      <button
        (click)="projectsClicked.emit()"
        title="Manage projects"
        aria-label="Manage projects"
        class="text-slate-500 hover:text-white transition-colors"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
      </button>
    </div>

    <div class="max-h-32 overflow-y-auto space-y-0.5">
      <button
        *ngFor="let project of projectService.projects()"
        (click)="startProjectThread(project.id)"
        [title]="'Start a new chat in ' + project.name"
        class="w-full text-left px-3 py-1.5 rounded-lg hover:bg-white/5 transition-all text-sm text-slate-300 flex items-center gap-2 truncate"
      >
        <svg class="w-3.5 h-3.5 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        </svg>
        <span class="truncate">{{ project.name }}</span>
      </button>
      <button
        *ngIf="projectService.projects().length === 0"
        (click)="projectsClicked.emit()"
        class="w-full text-left px-3 py-1.5 rounded-lg hover:bg-white/5 transition-all text-xs text-slate-500"
      >
        Create your first project
      </button>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto px-2 space-y-1 border-t border-white/5 pt-2">
    <!-- Skeleton loader: shown only while the initial saved-history fetch is
         in flight, so a slow/retrying load reads as "loading" rather than
         a misleading "you have no chats yet". -->
    <div *ngIf="chatService.isLoadingThreads()" class="space-y-1.5 px-3 py-2.5" aria-hidden="true">
      <div *ngFor="let i of [1, 2, 3, 4, 5]" class="h-4 rounded-md bg-white/5 animate-pulse" [style.width.%]="70 - i * 6"></div>
    </div>

    <ng-container *ngIf="!chatService.isLoadingThreads()">
    <!-- Client-side filter over already-loaded thread titles - only shown once
         there's more than a couple threads to make searching worthwhile. No
         backend search endpoint exists, so this never leaves the browser. -->
    <div *ngIf="chatService.threads().length > 0" class="relative px-1 pb-2">
      <svg
        class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-500"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z" />
      </svg>
      <input
        type="search"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        placeholder="Search chats"
        aria-label="Search chats"
        class="w-full pl-8 pr-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-slate-500/50 transition-colors"
      />
    </div>

    <div *ngFor="let thread of filteredThreads()">
      <button
        (click)="selectThread(thread.id)"
        [attr.aria-current]="chatService.activeThreadId() === thread.id ? 'true' : null"
        [ngClass]="chatService.activeThreadId() === thread.id ? 'bg-white/10' : ''"
        class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-white/5 transition-all text-sm text-slate-300 flex flex-col"
      >
        <span class="truncate w-full">{{ thread.title || 'New Chat' }}</span>
        <span *ngIf="projectNameFor(thread.projectId) as projectName" class="text-xs2 text-slate-500 truncate w-full">
          {{ projectName }}
        </span>
      </button>
    </div>

    <!-- Empty states: no saved chats at all, vs. none matching the search query. -->
    <div *ngIf="chatService.threads().length === 0" class="px-3 py-8 text-center">
      <p class="text-xs text-slate-500">No conversations yet</p>
      <p class="text-xs15 text-slate-600 mt-1">Start a new chat to see it here.</p>
    </div>
    <div *ngIf="chatService.threads().length > 0 && filteredThreads().length === 0" class="px-3 py-8 text-center text-xs text-slate-500">
      No chats match "{{ searchQuery() }}".
    </div>
    </ng-container>
  </div>

  <div class="p-4 border-t border-white/5">
    <button (click)="settingsClicked.emit()" aria-label="Settings" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all text-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span>Settings</span>
    </button>
  </div>
</aside>
