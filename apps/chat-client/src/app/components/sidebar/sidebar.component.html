<aside
  [class.translate-x-0]="isOpen"
  [class.-translate-x-full]="!isOpen"
  [class.lg:w-64]="isOpen"
  [class.lg:w-0]="!isOpen"
  [class.lg:border-r-0]="!isOpen"
  class="w-64 bg-[var(--color-bg-primary)] border-r border-[var(--color-border-light)] flex flex-col transition-[transform,width] duration-300 ease-in-out absolute lg:relative lg:translate-x-0 z-20 h-[calc(100vh-3.5rem)] overflow-hidden"
>
  <!-- Mobile close button - hidden on lg and above -->
  <div class="flex items-center justify-between px-4 py-2 lg:hidden border-b border-[var(--color-border-light)]">
    <span class="text-xs font-semibold text-[var(--color-text-tertiary)]">Menu</span>
    <button
      (click)="closeSidebar.emit()"
      aria-label="Close sidebar"
      title="Close menu"
      class="p-1.5 rounded-lg text-[var(--color-text-tertiary)] hover:text-[var(--color-text-primary)] hover:bg-[var(--color-surface-secondary)] transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-accent-primary)]"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- New Chat Button -->
  <div class="p-3">
    <button
      (click)="createNewThread()"
      aria-label="New chat"
      class="w-full py-2 px-3 rounded-lg hover:bg-[var(--color-surface-secondary)] flex items-center gap-2 text-sm font-medium transition-all text-[var(--color-text-primary)]"
    >
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span>New Chat</span>
    </button>
  </div>

  <!-- Projects Section -->
  <div class="px-2 py-2 border-t border-[var(--color-border-light)]">
    <div class="flex items-center justify-between px-3 pb-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-[var(--color-text-muted)]">Projects</span>
      <button
        (click)="projectsClicked.emit()"
        title="Manage projects"
        aria-label="Manage projects"
        class="text-[var(--color-text-muted)] hover:text-[var(--color-text-secondary)] transition-colors p-1 rounded hover:bg-[var(--color-surface-secondary)]"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
      </button>
    </div>

    <div class="max-h-32 overflow-y-auto space-y-0.5">
      <button
        *ngFor="let project of projectService.projects()"
        (click)="startProjectThread(project.id)"
        [title]="'Start a new chat in ' + project.name"
        class="w-full text-left px-3 py-1.5 rounded-lg hover:bg-[var(--color-surface-secondary)] transition-all text-sm text-[var(--color-text-secondary)] flex items-center gap-2 truncate"
      >
        <svg class="w-3.5 h-3.5 text-[var(--color-text-tertiary)] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        </svg>
        <span class="truncate">{{ project.name }}</span>
      </button>
      <button
        *ngIf="projectService.projects().length === 0"
        (click)="projectsClicked.emit()"
        class="w-full text-left px-3 py-1.5 rounded-lg hover:bg-[var(--color-surface-secondary)] transition-all text-xs text-[var(--color-text-muted)]"
      >
        Create your first project
      </button>
    </div>
  </div>

  <!-- Chat History Section -->
  <div class="flex-1 overflow-y-auto px-2 space-y-1 border-t border-[var(--color-border-light)] pt-2">
    <!-- Loading skeleton -->
    <div *ngIf="chatService.isLoadingThreads()" class="space-y-1.5 px-3 py-2.5" aria-hidden="true">
      <div *ngFor="let i of [1, 2, 3, 4, 5]" class="h-3 rounded-md bg-[var(--color-surface-secondary)] animate-pulse" [style.width.%]="70 - i * 6"></div>
    </div>

    <ng-container *ngIf="!chatService.isLoadingThreads()">
      <!-- Search -->
      <div *ngIf="chatService.threads().length > 0" class="relative px-1 pb-2">
        <svg
          class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-[var(--color-text-muted)]"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z" />
        </svg>
        <input
          type="search"
          [value]="searchQuery()"
          (input)="onSearchInput($event)"
          placeholder="Search chats"
          aria-label="Search chats"
          class="w-full pl-7 pr-3 py-1.5 rounded-lg bg-[var(--color-surface-secondary)] border border-[var(--color-border-light)] text-xs text-[var(--color-text-primary)] placeholder-[var(--color-text-muted)] focus:outline-none focus:border-[var(--color-accent-primary)] transition-colors"
        />
      </div>

      <!-- Thread List -->
      <div *ngFor="let thread of filteredThreads()">
        <button
          (click)="selectThread(thread.id)"
          [attr.aria-current]="chatService.activeThreadId() === thread.id ? 'true' : null"
          [ngClass]="chatService.activeThreadId() === thread.id ? 'bg-[var(--color-surface-secondary)] text-[var(--color-accent-primary)]' : ''"
          class="w-full text-left px-3 py-2 rounded-lg hover:bg-[var(--color-surface-secondary)] transition-all text-sm text-[var(--color-text-secondary)] flex flex-col"
        >
          <span class="truncate w-full font-medium">{{ thread.title || 'New Chat' }}</span>
          <span *ngIf="projectNameFor(thread.projectId) as projectName" class="text-xs text-[var(--color-text-tertiary)] truncate w-full mt-0.5">
            {{ projectName }}
          </span>
        </button>
      </div>

      <!-- Empty State -->
      <div *ngIf="chatService.threads().length === 0" class="px-3 py-8 text-center">
        <p class="text-xs text-[var(--color-text-tertiary)]">No conversations yet</p>
        <p class="text-xs text-[var(--color-text-muted)] mt-1">Start a new chat to see it here.</p>
      </div>
      <div *ngIf="chatService.threads().length > 0 && filteredThreads().length === 0" class="px-3 py-8 text-center text-xs text-[var(--color-text-muted)]">
        No chats match "{{ searchQuery() }}".
      </div>
    </ng-container>
  </div>

  <!-- Settings Footer -->
  <div class="p-3 border-t border-[var(--color-border-light)] bg-[var(--color-bg-secondary)]">
    <button (click)="settingsClicked.emit()" aria-label="Settings" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-[var(--color-text-tertiary)] hover:text-[var(--color-text-primary)] hover:bg-[var(--color-surface-secondary)] transition-all text-sm">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span>Settings</span>
    </button>
  </div>
</aside>
