<div class="h-screen w-screen flex flex-col bg-obsidian text-slate-100 overflow-hidden relative font-sans">
  <app-navbar
    (toggleSidebar)="isSidebarOpen = !isSidebarOpen"
    (openSettings)="openSettings()"
    (openAdmin)="openAdminView()"
  ></app-navbar>

  <div class="flex-1 flex overflow-hidden relative z-10">
    <app-sidebar
      *ngIf="authService.userSignal()"
      [isOpen]="isSidebarOpen"
      (threadSelected)="closeSidebarOnMobile()"
      (settingsClicked)="openSettings()"
      (projectsClicked)="openProjects()"
    ></app-sidebar>

    <div
      *ngIf="isSidebarOpen && authService.userSignal()"
      (click)="isSidebarOpen = false"
      class="fixed inset-0 bg-black/50 z-[15] lg:hidden"
    ></div>

    <main class="flex-1 flex flex-col h-full overflow-hidden bg-obsidian">
      <app-chat-window class="flex-1 overflow-hidden"></app-chat-window>
      <app-message-input></app-message-input>
    </main>
  </div>

  <app-session-expired-modal *ngIf="authService.sessionExpired()"></app-session-expired-modal>
  <app-login-error-toast *ngIf="authService.loginError()"></app-login-error-toast>
  <app-settings-modal *ngIf="isSettingsOpen" (closeModal)="closeSettings()"></app-settings-modal>
  <app-projects-modal *ngIf="isProjectsOpen" (closeModal)="closeProjects()"></app-projects-modal>

  <div *ngIf="isAdminViewOpen" class="fixed inset-0 z-50 bg-obsidian overflow-y-auto">
    <lib-admin-dashboard (close)="closeAdminView()"></lib-admin-dashboard>
  </div>
</div>
