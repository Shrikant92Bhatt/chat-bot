server {
    # Cloud Run routes traffic to whatever port the container listens on;
    # this image is always deployed with container port 8080.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached - it's the only thing that references
    # the current build's hashed JS/CSS filenames, so a stale cached copy
    # keeps a browser pointed at old (possibly deleted) hashed assets from a
    # previous deploy indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets - safe to cache aggressively/forever because the
    # Angular build hashes these filenames (outputHashing: "all"), so any
    # content change gets a new URL rather than overwriting this one.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Disable access log for favicon & robots
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
